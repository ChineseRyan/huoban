<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>活板</title>
<!--
  单文件界面，零构建、零 npm（docs/gui-design.md 的「目标与边界」一节）。
  界面里的「决定N」见 `docs/notes/ui-round2-decisions.md`（N 即该笔记表格的编号）。

  视觉口径：这本书的工具，界面就该像纸。底色用封面那套「宣纸」(#F1EFE8)，
  正文用「墨」(#1B1D1E)，唯一的彩色是封面方案里的「印」(#A83A2E)，
  只出现在主按钮和警告上。不用阴影、不用渐变、不用圆角卡片堆叠 ——
  这些正是 docs/gui-design.md 的「目标与边界」一节「明确不做」之外最容易让工具显得像演示页的东西。

  换视图只切 body 上的 class（docs/gui-design.md 的「三个实现陷阱」一节陷阱 2：二次 load_html 会丢拖放监听，
  所以启动只 load 一次）。
-->
<style>
  :root {
    --paper: #F1EFE8;
    --paper-2: #E9E6DD;
    --ink: #1B1D1E;
    --ink-2: #6B675C;
    --ink-3: #928C7E;
    --seal: #A83A2E;
    /* 拖放墨团那两团「墨」：写成 RGB 三元组，是给 rgba(var(--tone), …) 用的。
       能处理的书 = 印色那支暖红，明显不是书的东西 = 墨色。
       值就是 --seal / --ink，但十六进制塞不进 rgba() 的槽位，只能各写一份。 */
    --bloom-book: 168, 58, 46;
    --bloom-other: 27, 29, 30;
    /* 背景残字的颜色：比 ink-3 还淡一档。只在处理中页的背景里用。 */
    --faint: #B7AE9B;
    --rule: rgba(27, 29, 30, 0.16);
    --rule-soft: rgba(27, 29, 30, 0.09);
    --serif: "Noto Serif SC", "Source Han Serif SC", "Songti SC", "SimSun", serif;
    --sans: "Noto Sans SC", "Microsoft YaHei UI", "Microsoft YaHei", sans-serif;

    /* 印色的几档透明度。抽成变量是为了深色模式能整组换掉 ——
       在深底上 rgba(印, 0.035) 几乎不可见，直接换色比逐处调 alpha 可靠。 */
    --seal-tint: rgba(168, 58, 46, 0.035);
    --seal-line: rgba(168, 58, 46, 0.5);
    --seal-line-2: rgba(168, 58, 46, 0.55);
    --seal-fill: rgba(168, 58, 46, 0.06);
    --seal-border: rgba(168, 58, 46, 0.4);

    /* 悬停底色、行分隔线、滚动条：都是"墨的淡淡一层"，
       深色模式下要换成"纸的淡淡一层"。 */
    --hover: rgba(27, 29, 30, 0.03);
    --row-line: rgba(27, 29, 30, 0.05);
    --thumb: rgba(27, 29, 30, 0.16);
    --thumb-hover: rgba(27, 29, 30, 0.28);

    /* 主按钮：浅色下是墨底纸字，深色下反过来。 */
    --primary-bg: #1B1D1E;
    --primary-fg: #F6F3EC;
    --primary-hover: #33373A;
  }

  /* ---------- 深色模式 ----------
     试用反馈"应用无深色模式"。三态：跟随系统 / 固定深 / 固定浅，
     由 JS 写 <html data-dark="1|0"> 决定，CSS 只认这个属性（不认 media query）——
     认属性才能让"固定浅色"在系统是深色时也真的浅。
     配色取封面「松墨」那套 (#15181D 底 / 宣纸白字)，不是纯黑纯白：
     纯 #000 上的白字会发晕，纯 #FFF 会刺眼。
     印色提亮到 #E07A6C：原色 #A83A2E 在深底上只有 3.1:1，
     而警告文字是小字号，要过 4.5:1（提亮后实测 6.3:1）。 */
  html[data-dark="1"] {
    --paper: #15181D;
    --paper-2: #1D2128;
    --ink: #E8E4DA;
    --ink-2: #A8A296;
    --ink-3: #77726A;
    --seal: #E07A6C;
    --bloom-book: 224, 122, 108;
    --bloom-other: 232, 228, 218;
    --faint: #565248;
    --rule: rgba(232, 228, 218, 0.20);
    --rule-soft: rgba(232, 228, 218, 0.11);

    --seal-tint: rgba(224, 122, 108, 0.10);
    --seal-line: rgba(224, 122, 108, 0.55);
    --seal-line-2: rgba(224, 122, 108, 0.6);
    --seal-fill: rgba(224, 122, 108, 0.12);
    --seal-border: rgba(224, 122, 108, 0.45);

    --hover: rgba(232, 228, 218, 0.05);
    --row-line: rgba(232, 228, 218, 0.07);
    --thumb: rgba(232, 228, 218, 0.18);
    --thumb-hover: rgba(232, 228, 218, 0.30);

    --primary-bg: #E8E4DA;
    --primary-fg: #15181D;
    --primary-hover: #CFC9BC;
  }

  /* 换主题时不要闪白：只在 body 上做颜色过渡，别给 * 加 transition
     （那会让拖放边框、进度条之类的动画一起变慢）。 */
  body { transition: background-color 140ms linear, color 140ms linear; }
  @media (prefers-reduced-motion: reduce) {
    body { transition: none; }
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--serif);
    /* 拖进来时整窗是落点，任何地方都不该出现文字光标 */
    cursor: default;
    -webkit-user-select: none;
    user-select: none;
    overflow: hidden;
  }

  /* 视图互斥。用 display:none 而不是重新加载页面。 */
  body[data-view="drop"] #view-drop,
  body[data-view="busy"] #view-busy,
  body[data-view="result"] #view-result,
  body[data-view="review"] #view-review,
  body[data-view="meta"] #view-meta,
  body[data-view="done"] #view-done,
  body[data-view="about"] #view-about,
  body[data-view="error"] #view-error { display: block; }

  .view { display: none; height: 100%; }

  /* ---------- 窗口边角 ----------
     没有顶栏了。原来那一条 52px 的横带（书印 + 名字 + 版本号 + 主题）
     是每一屏都要交的过路费：它在，内容就矮 52px —— ④ 页为此差 28px，
     把四个封面动作挤出视口。而它回答的问题（这是什么程序）用户只问一次。
     现在只留两样贴角的东西：右上角一枚没有框的日/月（决定5），
     每一屏都在（「关于」页除外）；复核页和 ④ 页的左上角各有一枚返回
     箭头，点它回上一屏（决定23）。首页只留右上角这枚日/月 —— 首页本来
     就是空的那一屏。
     用 fixed 贴窗口边，不占版面高度；pointer-events 只在子元素上开，
     免得它挡住下面整片拖放区。 */
  .chrome {
    position: fixed;
    top: 0; right: 0;
    padding: 10px 12px;
    z-index: 30;
    pointer-events: none;
    transition: opacity 200ms linear;
  }

  .chrome > * { pointer-events: auto; }

  /* 主题按钮：一个图标，没有框，没有底。三态（跟随系统/深/浅）点一下换一个。
     贴在窗口右上角之后，它的视觉重量必须低于任何一个正文元素 ——
     14px 的线图标、--ink-3、悬停才升到 --ink。 */
  .theme-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 26px;
    height: 26px;
    padding: 0;
    border: none;
    background: none;
    color: var(--ink-3);
    cursor: pointer;
    border-radius: 3px;
    transition: color 140ms linear, background-color 140ms linear;
  }

  .theme-btn:hover { color: var(--ink); background: var(--hover); }

  .theme-btn svg { display: block; }

  /* 页面顶部的那一行：左边是第几步，右边是文件名。
     步骤指示原来在顶栏里，和主题按钮、版本号挤在一起 —— 三件小事并排，
     顶栏就成了仪表盘。挪进正文之后它变成"页码"，和这套纸面语言是一路的：
     书的页码本来就在页脚/页眉的角落，不在书脊上。
     只留两位序号，不写"N / 5"：总步数是硬编码，加一页就会谎报；
     而"这是第几步"本来就在序号里，分母不说也知道。 */
  .pagetop {
    display: flex;
    align-items: baseline;
    gap: 12px;
    margin-bottom: 26px;
  }

  .pgno {
    font-family: var(--sans);
    font-size: 11px;
    letter-spacing: 0.1em;
    color: var(--ink-3);
    font-variant-numeric: tabular-nums;
  }

  .pgname {
    font-family: var(--sans);
    font-size: 12px;
    letter-spacing: 0.12em;
    color: var(--ink-2);
  }

  main {
    height: 100%;
    display: flex;
    flex-direction: column;
  }

  /* ---------- ① 导入：整窗即拖放区 ---------- */

  /* 为什么：见 docs/notes/drop-click-whole-window.md */
  /* 整个窗口都是落点；但"按钮"只在四角裁切线围出的框里 —— 热区见 #drop-hot。
     框自己不再接 click，里面只挂热区这一份监听，所以不会点一次弹两个文件框。 */
  #drop-area {
    flex: 1;
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 24px;
    padding: 48px;
    /* 墨团要跟着光标跑到纸边上：跑出去就裁掉，别让它在窗外面撑出一截滚动区 */
    overflow: hidden;
  }

  /* 四角裁切线，代替原来那圈虚线。
     虚线框是"上传控件"的形状，每个网页都有；裁切线是"纸"的形状 ——
     印刷里它标"沿这儿裁"，正好是这本工具的语言（宣纸、墨、印）。
     更实际的好处：它只占四个角，中间那片整块留给字，不再是一个
     1013×530 的大框套两行小字、四周全是空白。
     尺寸变化是给"拖进来了"用的：角往里长，像纸被压住四角。 */
  /* 26px 的时候右上那根裁切线正好压在主题按钮底下，被挡掉了一半 ——
     四根线断一根，看着像渲染坏了。让到 40px：裁切线退到按钮内侧，
     四角齐了，框也比原来那圈虚线更"外"、更像纸的裁切标记。 */
  #drop-area .marks {
    position: absolute;
    inset: 40px;
    pointer-events: none;
    transition: opacity 220ms linear;
  }

  #drop-area .marks i {
    position: absolute;
    width: 20px;
    height: 20px;
    border: 0 solid var(--ink-3);
    transition: border-color 180ms linear,
                width 300ms cubic-bezier(0.2, 0.7, 0.2, 1),
                height 300ms cubic-bezier(0.2, 0.7, 0.2, 1);
  }

  #drop-area .marks i:nth-child(1) { top: 0;    left: 0;  border-top-width: 1px;    border-left-width: 1px; }
  #drop-area .marks i:nth-child(2) { top: 0;    right: 0; border-top-width: 1px;    border-right-width: 1px; }
  #drop-area .marks i:nth-child(3) { bottom: 0; left: 0;  border-bottom-width: 1px; border-left-width: 1px; }
  #drop-area .marks i:nth-child(4) { bottom: 0; right: 0; border-bottom-width: 1px; border-right-width: 1px; }

  /* 点击热区：跟 .marks 同一个 inset:40px —— 裁切线画在哪，可点的框就到哪。
     全透明，只吃鼠标不吃像素（墨团、涟漪、字都还看得见）；cursor 只在这个框里
     是手型，框外是普通指针，点了什么都不发生。 */
  #drop-hot {
    position: absolute;
    inset: 40px;
    cursor: pointer;
  }

  #drop-hot:hover ~ .marks i { border-color: var(--ink-3); }

  /* ---------- 拖放：一团墨跟手 ----------
     拖进来的东西分两类，只按 MIME 判（dragover 阶段 pywebview 不给 JS 路径，
     扩展名也拿不到，见 TODO 第 3 组）。能处理的 → 暖色 --seal；明显不是书的
     （图片/音视频/PDF）→ 墨色 --ink。绿/红是通用软件语义，不是这身纸墨的调子。

     两层，都是 pointer-events:none 的绝对定位方块，靠 --x/--y 跟光标：
     .bloom 是一团径向渐变的墨，.ripple 是一圈从墨心荡开的环。 */
  #drop-area .bloom,
  #drop-area .ripple {
    position: absolute;
    left: 0;
    top: 0;
    width: 560px;
    height: 560px;
    /* 让 translate(50%,50%) 时墨心正好落在 0,0，之后写像素坐标即可 */
    margin: -280px 0 0 -280px;
    pointer-events: none;
    border-radius: 50%;
    transform: translate(var(--x, 50%), var(--y, 50%)) scale(0.88);
    opacity: 0;
  }

  #drop-area .bloom {
    background: radial-gradient(circle closest-side,
                rgba(var(--tone), 0.16) 0%,
                rgba(var(--tone), 0.11) 34%,
                rgba(var(--tone), 0.045) 62%,
                rgba(var(--tone), 0) 100%);
    transition: opacity 300ms linear,
                transform 420ms cubic-bezier(0.2, 0.7, 0.2, 1);
  }

  /* 第一次显形那一帧不许有位移过渡。transform 上那条 420ms 缓动是给"跟手"用的：
     光标移动时墨团稍微落后一点，看着像洇开。但兜底的 --x/--y 是 50%，那是相对
     墨团自身 560px 算的，落在区域左上 280,280 处 —— 带着过渡显形，墨团会从那里
     一路飘到光标，像从别处飞过来。所以第一次写坐标时挂上这个类，写完立刻摘掉。

     只掐掉 transform 那一条：淡入留着，墨团在光标底下慢慢显出来才对。 */
  #drop-area.bloom-snap .bloom { transition: opacity 300ms linear; }

  #drop-area .ripple {
    border: 1px solid rgba(var(--tone), 0.30);
    transform: translate(var(--x, 50%), var(--y, 50%)) scale(0.25);
  }

  /* 默认就是"书"那支暖色：一来平时那团墨 opacity 是 0，看不出颜色；二来没这个
     兜底，rgba(var(--tone), …) 在平时是无效值，整条渐变作废。只有"不是书"要改色。 */
  #drop-area { --tone: var(--bloom-book); }
  #drop-area[data-drop="other"] { --tone: var(--bloom-other); }

  #drop-area[data-drop="book"] .bloom,
  #drop-area[data-drop="other"] .bloom { opacity: 1; }

  @keyframes ripple {
    0%   { opacity: 0.5;
           transform: translate(var(--x, 50%), var(--y, 50%)) scale(0.22); }
    70%  { opacity: 0.14; }
    100% { opacity: 0;
           transform: translate(var(--x, 50%), var(--y, 50%)) scale(1); }
  }

  #drop-area[data-drop="book"] .ripple,
  #drop-area[data-drop="other"] .ripple {
    animation: ripple 1600ms cubic-bezier(0.2, 0.7, 0.2, 1) infinite;
  }

  /* 拖入时四角裁切线退到后面去：这时候画面主角是墨团，角是配角 */
  #drop-area[data-drop="book"] .marks,
  #drop-area[data-drop="other"] .marks { opacity: 0.45; }

  /* 拖入时右上主题按钮与右下「关于」也让位 */
  body[data-drop-active="1"] .chrome,
  body[data-drop-active="1"] #btn-about { opacity: 0.3; }

  @media (prefers-reduced-motion: reduce) {
    #drop-area .bloom { transition: opacity 120ms linear; }
    #drop-area[data-drop="book"] .ripple,
    #drop-area[data-drop="other"] .ripple { animation: none; opacity: 0.3; }
  }

  /* 首屏只有一句话：宋体 30px、字距 0.1em —— 宋体的横细竖粗在浅底上很像书名，
     这一屏除了书名什么都不该有。 */
  /* 一句话的三个状态叠在同一格里：位置、字号全不动，只交叉淡换字与颜色。
     三态分别是「平时 / 拖书 / 拖了不是书的东西」。

     用 grid 1×1 而不是绝对定位：三份字都放进同一个格子，格子宽度取最宽那份
     （平时态那六个字），所以换态时字宽变了也不会把版面推一下。 */
  .drop-title {
    display: grid;
    /* 标题只是字，不吃鼠标：点它应当落到底下的热区，弹出文件选择框 */
    pointer-events: none;
    font-size: 30px;
    letter-spacing: 0.10em;
    font-weight: 400;
    line-height: 1.25;
    /* 字距会把最后一个字后面也加上一份，整体看起来右偏，用负边距抵掉 */
    margin-right: -0.10em;
  }

  .drop-title span {
    grid-area: 1 / 1;
    justify-self: center;
    opacity: 0;
    /* 纸色光晕：墨团可能压在字后面，没有它字会被吃掉 */
    text-shadow: 0 0 18px var(--paper), 0 0 18px var(--paper),
                 0 0 10px var(--paper), 0 0 4px var(--paper);
    transition: opacity 200ms linear, color 200ms linear;
  }

  .drop-title .t-idle { opacity: 1; color: var(--ink); }
  .drop-title .t-book { color: var(--seal); }
  .drop-title .t-other { color: var(--ink); }

  #drop-area[data-drop="book"] .drop-title .t-idle,
  #drop-area[data-drop="other"] .drop-title .t-idle { opacity: 0; }
  #drop-area[data-drop="book"] .drop-title .t-book,
  #drop-area[data-drop="other"] .drop-title .t-other { opacity: 1; }

  /* ---------- 关于 ----------
     自用工具，「这是什么程序」一辈子只问一次，答一次就够了 ——
     所以这一屏不做功能说明：没有致谢、没有许可证、没有作者、没有年份。
     留下只有一枚印和一行版本号，像书末那块牌记：字越少，越像一件成品。

     内容总共 165px 高，永远比最小视口（520）矮，所以垂直居中直接用 center；
     auto margin 那套是给会超高的错误页用的，这儿用不上。

     这一屏还隐掉了右上角那枚主题按钮 —— 关于页是全站唯一没有窗框的一屏。
     想比深/浅两版印色，Esc 回首页切一次再点进来。 */
  #view-about main {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  /* 印面：一张 264×264 的 alpha 蒙版，底色吃 var(--seal) ——
     颜色不写死，浅色是 #A83A2E、深色自动变 #E07A6C，两版一次写。
     112px 是三档尺子量的：88 字口糊、136 压住版本号。
     ★ 蒙版图必须是带 alpha 通道的 RGBA：灰度 PNG 不会自动当遮罩，
       会整块糊成实心方块（这个坑踩过）。
     ★ -webkit- 前缀与标准属性双写，WebView2 两个都认，缺一个就没效果。 */
  .ab-mark {
    width: 112px;

  /* 版本号：这一屏唯一一行字。12px / 0.16em 字距 / --ink-3，
     比正文还淡一档 —— 它是这块牌记的落款，不是标题。 */
  .ab-ver {
    margin-top: 34px;
    font-family: var(--sans);
    font-size: 12px;
    letter-spacing: 0.16em;
    margin-right: -0.16em;
    color: var(--ink-3);
    line-height: 1.6;
  }

  /* 关于页不留窗框 */
  body[data-view="about"] .chrome { display: none; }

  /* 首页右下角那枚「关于」。11px、--ink-3、无框无底 ——
     它是这一屏最轻的东西，轻到不参与「把书拖到这里」那套版面，
     被指到才浮上来一档。 */
  #btn-about {
    position: fixed;
    right: 28px;
    bottom: 14px;
    z-index: 30;
    font-family: var(--sans);
    font-size: 11px;
    letter-spacing: 0.16em;
    padding: 4px 6px;
    /* 字距在末字后面也加一份，右端看着缩不进去，用负内边距抵掉 */
    padding-right: calc(6px - 0.16em);
    line-height: 1;
    color: var(--ink-3);
    background: none;
    border: none;
    border-radius: 3px;
    cursor: pointer;
    transition: color 140ms linear, opacity 200ms linear;
  }

  #btn-about:hover { color: var(--ink); }

  /* ---------- ② 处理中：一本书正在被处理 ----------
     这一屏只有一个任务：让人相信还在动。它不承担"到哪儿了" —— 真实的
     进度条也完全可能卡在 99%，而 99% 并不代表就差一点点（决定7）。
     所以这里没有百分比、没有阶段名、没有路径。

     两层：背景演"这本书正在被怎么样"，前景是书名与一句祈祷文案。
     背景有两套，因为两件事真的不一样：

       清洗（导入 / 复核 / 重跑）—— 纸上的字被划掉、碎行被并回去。
         一行字打出来，一道红线从左往右划过去，然后字与线一起化掉；
         两截断在逗号上的碎行，缝收拢成一行，再作为一个整体化掉。
         红线是这一屏唯一的强信号，用真印泥红，划完就跟着走。
       付梓（打包）—— 一枚枚字模压到纸上，从虚到实、从大到正，各自生灭。
         印是最后一道工序，不该拿去演清洗。

     两套共用同一套前景、同一套节奏，所以它们是同一只手在干活。
     前 1.1 秒整屏空白（决定9）：快的时候这一屏根本不该被看见。 */

  #view-busy main {
    position: relative;
    align-items: center;
    justify-content: center;
    padding: 0 48px;
  }

  /* 背景层：铺满整窗，不接事件，永远退到前景之后。
     ★ 碎纸那一套**不压 opacity** —— 压了红线会变成砖红，而这里是"真红线"。
       字要退后，靠的是字号与 ink-3 的淡，不靠一层灰罩。 */
  .busy-stage {
    position: absolute;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
  }

  /* 字模那一套整层压一档：它必须读作"纸背透上来的一层墨"，
     而不是"屏幕上贴着一堆黑方块"。
     --blk 是字模的边长，也挂在这一层上 —— 挂在 .busy-ink 上过，那个类
     从来没有元素带，于是字模宽高是 0，整屏一片空（踩过）。 */
  .busy-stage.is-ink {
    opacity: 0.72;
    /* 它是纸上的字，不是屏上的图，所以比"主角"小一号。 */
    --blk: clamp(34px, 5.2vmin, 50px);
  }

  /* ---- 前景：书名 + 一句文案。这一屏的主角是它们。 ---- */
  .busy-fore {
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    pointer-events: none;
    opacity: 0;
    transition: opacity 1400ms ease;
  }

  .busy-fore.on { opacity: 1; }

  /* 44px 是量出来的：1013×580 下它是"一屏之主"，又不会把书名顶到贴边。 */
  .prayer-title {
    font-family: var(--serif);
    font-size: 44px;
    line-height: 1.28;
    letter-spacing: 0.3em;
    /* 末尾那一格字距会把整行推得偏右，补回来才是真居中 */
    margin-right: -0.3em;
    color: var(--ink);
    max-width: 62vw;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .prayer-title[hidden] { display: none; }

  /* 祈祷文案（决定9）：越像"正在校对"越糟 —— 一闪而过时用户会读成
     "刚校对完"。所以只写跟工序无关、明显不承载信息的话，它的唯一职责
     是让等待不那么难熬。 */
  .prayer-line {
    margin-top: 26px;
    font-family: var(--sans);
    font-size: 16px;
    line-height: 1.6;
    letter-spacing: 0.34em;
    margin-right: -0.34em;
    color: var(--ink-2);
    min-height: 1.6em;
    opacity: 0;
    transition: opacity 900ms ease;
  }

  .prayer-line.on { opacity: 1; }

  @media (max-width: 820px) {
    .prayer-title { font-size: clamp(30px, 7.4vw, 40px); letter-spacing: 0.24em; margin-right: -0.24em; }
    .prayer-line { font-size: 14px; margin-top: 22px; }
  }

  /* ---- 背景之一：字模（付梓） ----
     一枚字模：整块实墨、字挖空（白文）、边缘带纸纤维的毛茬。
     毛边用内联 SVG 的 feDisplacementMap 把矩形的四条边推开 —— 零外链。
     ★ 字在遮罩之外，所以刀口是利的、纸边是毛的，这一对矛盾正是它像真印的原因。 */
  .bg-slot {
    position: absolute;
    width: var(--blk);
    height: var(--blk);
    transform: translate(-50%, -50%);
  }

  .bg-blk {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--ink);
    border-radius: 1px;
    opacity: 0;
    will-change: opacity, transform, filter;
    -webkit-mask-size: 100% 100%;
    mask-size: 100% 100%;
    -webkit-mask-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100'><filter id='br1' x='-20%' y='-20%' width='140%' height='140%'><feTurbulence type='fractalNoise' baseFrequency='0.09' numOctaves='4' seed='7'/><feDisplacementMap in='SourceGraphic' in2='n' scale='3.2' xChannelSelector='R' yChannelSelector='G'/></filter><rect x='2' y='2' width='96' height='96' rx='2' fill='%23fff' filter='url(%23br1)'/></svg>");
    mask-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100'><filter id='br2' x='-20%' y='-20%' width='140%' height='140%'><feTurbulence type='fractalNoise' baseFrequency='0.09' numOctaves='4' seed='7'/><feDisplacementMap in='SourceGraphic' in2='n' scale='3.2' xChannelSelector='R' yChannelSelector='G'/></filter><rect x='2' y='2' width='96' height='96' rx='2' fill='%23fff' filter='url(%23br2)'/></svg>");
  }

  /* 字：反着写（版上刻的是反字），压印之后才读得正。 */
  .bg-glyph {
    font-family: var(--serif);
    font-size: calc(var(--blk) * 0.78);
    line-height: 1;
    font-weight: 700;
    color: var(--paper);
    transform: scaleX(-1);
  }

  /* 浮现：2 秒，从虚到实、从大到正。
     ★ 这里没有位移。位移会读作"从天上掉下来"，而字模是压上去的。
     ★ 不透明度在前 16% 就冲到 .55、62% 就到 1：半透明的实墨方块会被
       读成"没对准的影子"，是这一屏最脏的一种中间态。 */
  .bg-blk.in {
    animation:
      bg-form 2000ms cubic-bezier(0.22, 0.7, 0.24, 1) both,
      bg-breathe var(--bt, 8100ms) 2000ms ease-in-out infinite;
  }

  @keyframes bg-form {
    0%   { opacity: 0;   transform: scale(1.12) rotate(var(--rot, 0deg)); filter: blur(6px); }
    16%  { opacity: 0.55; transform: scale(1.08) rotate(var(--rot, 0deg)); filter: blur(3.4px); }
    62%  { opacity: 1;   transform: scale(1.015) rotate(0deg); filter: blur(0.4px); }
    100% { opacity: 1;   transform: scale(1) rotate(0deg); filter: blur(0); }
  }

  /* 呼吸感的来源不是"动得快"，是每一枚的周期都不一样（--bt 每枚随机 8–14 秒）。
     齐步走就成了心跳，读作"要结束了"。
     ★ 呼吸必须以实墨为基线往下淡 —— 反过来会跳变，看着像闪一下。 */
  @keyframes bg-breathe {
    0%, 100% { opacity: 1;   transform: scale(1); }
    50%      { opacity: 0.72; transform: scale(1.026); }
  }

  /* 化开：不位移，只在原地慢慢变虚、微微缩下去。
     消失必须比出现慢得多：出现是"压上去"（一下子），消失是"墨洇进纸里"。 */
  .bg-blk.out { animation: bg-fade 2400ms cubic-bezier(0.4, 0, 0.6, 0.5) both; }

  @keyframes bg-fade {
    0%   { opacity: 1;   transform: scale(1); filter: blur(0); }
    30%  { opacity: 0.86; transform: scale(1); filter: blur(0.5px); }
    100% { opacity: 0;   transform: scale(0.94); filter: blur(3.4px); }
  }

  /* ---- 背景之二：碎纸（清洗 / 复核 / 重跑） ----
     一片碎纸：整块按各自的小角度歪着，像从书页上撕下来摊在桌上。
     它只做两件事 —— 淡入、淡出；位移交给里面的行（并段时缝隙要收）。 */
  .bg-pc {
    position: absolute;
    transform: translate(-50%, -50%) rotate(var(--rot, 0deg));
    opacity: 0;
    --pa: .85;
    will-change: opacity, filter;
  }

  .bg-pc.in { animation: bg-pc-in 760ms cubic-bezier(0.2, 0.7, 0.25, 1) both; }

  @keyframes bg-pc-in {
    0%   { opacity: 0; filter: blur(3.2px); }
    100% { opacity: var(--pa, .85); filter: blur(0); }
  }

  /* 化掉：整块一起走，不留在屏上。出现是"打出来"（快、清楚），
     消失是"洇进纸里"（慢、散开）。
     ★ 红线先退 —— 字本来就淡，大红条却是全屏最亮的东西。 */
  .bg-pc.out { animation: bg-pc-out 760ms cubic-bezier(0.4, 0, 0.6, 0.5) both; }

  @keyframes bg-pc-out {
    0%   { opacity: var(--pa, .85); filter: blur(0); }
    34%  { opacity: calc(var(--pa, .85) * .72); filter: blur(1.8px); }
    100% { opacity: 0; filter: blur(4px); }
  }

  .bg-pc.out .bg-rk { opacity: 0; transition: opacity 300ms ease; }

  /* 一行字 */
  .bg-line {
    position: relative;
    display: block;
    max-width: min(28vw, 240px);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    font-family: var(--serif);
    font-size: 11.5px;
    line-height: 1.6;
    letter-spacing: 0.04em;
    color: var(--ink-3);
  }

  .bg-line .ch { opacity: 0; transition: opacity 260ms ease; }
  .bg-line.on .ch { opacity: 1; }

  /* 红线：2px、真印泥红、从左往右划过去。不压不虚、不淡出 ——
     划完就跟着整块一起消失。 */
  .bg-rk {
    position: absolute;
    left: 0;
    right: 0;
    top: 50%;
    height: 2px;
    margin-top: -0.6px;
    background: var(--seal);
    transform: scaleX(0);
    transform-origin: left center;
    transition: transform 460ms cubic-bezier(0.3, 0.05, 0.15, 1);
  }

  .bg-line.rule .bg-rk { transform: scaleX(1); }

  /* 两截碎行。合并不是"变淡"，是这条缝收拢成正常行距。 */
  .bg-merge { display: block; max-width: min(28vw, 240px); }

  /* 深色下碎纸用的是 --ink-3，本该比浅色更亮一点才看得见；但纯在纸上
     是墨，深色下再亮就成了一行白字。这里单独把它压回去半档，靠 --faint。 */
  html[data-dark="1"] .bg-line,
  html[data-dark="1"] .bg-ml { color: var(--faint); }

  .bg-ml {
    display: block;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    font-family: var(--serif);
    font-size: 11.5px;
    line-height: 1.55;
    letter-spacing: 0.04em;
    color: var(--ink-3);
  }

  .bg-merge .bg-ml + .bg-ml {
    margin-top: 1.55em;
    transition: margin-top 980ms cubic-bezier(0.35, 0, 0.15, 1);
  }

  .bg-merge.merged .bg-ml + .bg-ml { margin-top: 0.05em; }

  @media (max-width: 820px) {
    .bg-line, .bg-ml { font-size: 10.5px; }
    .bg-line, .bg-merge { max-width: min(34vw, 240px); }
  }

  /* ---- 取消（决定10）：压在右下角，一个词，不带框 ----
     字号比正文还小 —— 它是退路，不是并列选项。
     前 1.1 秒不出现：快的时候这一屏根本不该被看见。 */
  .busy-cancel {
    position: absolute;
    right: 26px;
    bottom: 20px;
    border: 0;
    background: none;
    padding: 6px 4px;
    font-family: var(--sans);
    font-size: 12.5px;
    letter-spacing: 0.14em;
    margin-right: -0.14em;
    color: var(--ink-3);
    cursor: pointer;
    opacity: 0;
    pointer-events: none;
    transition: opacity 900ms ease, color 160ms ease;
  }

  .busy-cancel.on { opacity: 1; pointer-events: auto; }

  .busy-cancel:hover { color: var(--seal); }

  /* 系统里开了「减少动态效果」就不要演：这一屏的职责是"我还活着"，
     静止的一行字同样说得清，晃来晃去反而是折磨。 */
  @media (prefers-reduced-motion: reduce) {
    .bg-blk, .bg-blk.in, .bg-blk.out { animation: none; opacity: 1; }
    .bg-pc, .bg-pc.in, .bg-pc.out { animation: none; opacity: 1; }
    .bg-line .ch { opacity: 1; }
  }

  /* ---------- ② 结果 / 错误：一栏到底，没有卡片 ---------- */

  .sheet {
    flex: 1;
    /* 内容区自己滚、动作条不动 —— 见下面 .scroll / .actions 的注释。
       这样窗口多矮、页里多几行，主按钮都还在。 */
    display: flex;
    flex-direction: column;
    overflow: hidden;
    padding: 24px 28px 14px;
  }

  .sheet > .col {
    max-width: 620px;
    width: 100%;
    margin: 0 auto;
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
  }

  /* ⑤ 页（元数据与封面）是三栏：封面 | 书文 | 标签列。比其它页宽得多，
     不是为了气派，是因为这页在 720×520 下真实溢出过 54px（封面列 320px
     的画框 + 两行的封面动作，怎么让间距都救不回来）—— 宽度是把高度
     换成横向空间的唯一办法。 */
  .sheet.wide > .col { max-width: 1008px; }

  /* 只有这块滚。之前是整页（.sheet）一起滚，于是"多加一行内容"就把主按钮
     顶出视口 —— ④ 页为此先后被挤出 59px / 30px / 更多，每次都得重算间距。
     根子是结构：按钮和内容共享同一个滚动条。分开之后加内容不再影响按钮。 */
  .sheet .scroll {
    /* flex: 0 1 auto 而不是 1：内容短的时候让动作条紧跟着内容，
       不要被推到底边、中间留一大片空白（第一版截图就是这样，像没加载完）。
       flex-shrink 仍然是 1，所以内容长了会自己滚，按钮永远在视口内。 */
    flex: 0 1 auto;
    min-height: 0;
    overflow-y: auto;
    /* 负边距 + 正内距：滚动条贴到 .sheet 的 padding 内沿，内容不贴边。 */
    margin-right: -14px;
    padding-right: 14px;
  }

  /* 这一页只回答一个问题：现在能不能直接打包。
     所以只留三样东西 —— 书名（这是哪本书）、三个数（这本书多大、我动了
     多少）、"需要人看一眼"（不能直接打包的理由）。
     原来那七行明细（编码 / 文件大小 / 行数 / 段落 / 平均每章字数 / 改写…）
     全撤了：没有一条会改变"打不打包"这个决定，却把一屏概览撑成了要滚动的
     报表（决定12 / 决定18 —— 概览页的长度本身就是判据）。

     版式叫"账本式"：左边一栏账（三个数竖排、点线连着标签），右边一栏陈情
     （请君端详），中间一道发丝线隔开。整块在标题与动作条之间的剩余空间里
     垂直居中。为什么是两栏而不是一行三格：告警句长短不齐，铺成一行三格时
     数字会被句子的宽度牵着走，账就不像账了。

     三条尺寸规矩（三档窗口都不破，见 _shot/resize-check.js）：
     · 宽度：内容列最宽 880px 居中 —— 行长压在 30–40 字，窗口再宽也不拉长行；
     · 高度：grid 两行（标题 auto / 内容 1fr），多出来的空间只落在内容区；
     · 间距：全用固定 px，不用 vh / 百分比 —— 间距不随窗口高度变，拖高不散架。 */
  #view-result .sheet > .col { max-width: 880px; }

  #view-result .scroll {
    flex: 1 1 auto;
    display: grid;
    grid-template-rows: auto 1fr;
    padding-top: 8px;
  }

  /* 书名：这一页最大的字，也是唯一告诉用户"打开的是哪本"的东西。
     不显示路径（决定14）—— 路径他刚给过，书名他还没有。
     26px 而不是 34px：它是页眉不是主角，主角是下面那栏账。 */
  .r-title {
    font-size: 26px;
    line-height: 1.3;
    letter-spacing: 0.01em;
    color: var(--ink);
    word-break: break-word;
    /* 右上角那枚日/月是 fixed 的覆盖层，不占版面：书名第一行能一路写到
       vw-28，而按钮从 vw-38 起 —— 长书名会钻到按钮底下。留出 22px 让开它。 */
    padding-right: 22px;
    -webkit-user-select: text;
    user-select: text;
  }

  /* 账与陈情合成一块内容区，在剩余空间里居中。
     用 grid 而不是 flex：右边那栏要跨满两行（账 + 回执），flex 做不到跨行。 */
  #view-result .r-body {
    grid-row: 2;
    margin: 0;
    padding: 0;
    min-height: 0;
    display: grid;
    grid-template-columns: 200px minmax(0, 1fr);
    column-gap: 64px;
    align-content: center;
  }

  /* 账本一栏。数字贴右、标签贴左、中间用点线连起来 —— 像目录页的页码，
     眼睛从标签滑到数字时不会串行。点线只在两者之间那一小段，不拉满整栏。 */
  #r-figures {
    grid-column: 1;
    grid-row: 1;
    align-self: center;
    display: flex;
    flex-direction: column;
    align-items: stretch;
  }

  .r-fig {
    display: flex;
    flex-direction: row-reverse;
    align-items: center;
    padding: 13px 0;
  }

  .r-fig:first-child { padding-top: 0; }

  .r-fig:last-child { padding-bottom: 0; }

  /* 竖排之后不再需要竖线分隔（上一版是三格横排，靠发丝线隔开） */
  .r-fig + .r-fig {
    padding-left: 0;
    border-left: 0;
  }

  .r-fig b {
    display: block;
    font-size: 29px;
    font-weight: 400;
    line-height: 1;
    letter-spacing: 0;
    font-variant-numeric: tabular-nums;
    color: var(--ink);
  }

  .r-fig span {
    flex: 1;
    min-width: 0;
    display: flex;
    align-items: center;
    margin: 0;
    font-family: var(--sans);
    font-size: 12px;
    letter-spacing: 0.18em;
    color: var(--ink-3);
    white-space: nowrap;
  }

  /* 点线：2px 点、7px 空，比正文的虚线更疏，不抢数字的眼 */
  .r-fig span::after {
    content: "";
    flex: 1;
    min-width: 6px;
    margin: 0 11px;
    height: 2px;
    background-image: repeating-linear-gradient(to right,
      var(--ink-3) 0 2px, transparent 2px 9px);
    opacity: 0.55;
  }

  /* 重跑回来时的一行交代：只写"你刚才的调整到底生效了没有"。
     产物路径不写（决定15：不能点、不能选、不能复制，显示给谁看）。 */
  .r-note {
    margin-top: 26px;
    font-family: var(--sans);
    font-size: 12px;
    letter-spacing: 0.05em;
    color: var(--ink-3);
    font-variant-numeric: tabular-nums;
  }

  /* 警告：左缘一道印色发丝线，不折叠（铁律 2）。④ 页还在用这套。 */
  .warnings { margin: 0 0 32px; }

  .warnings .cap {
    font-family: var(--sans);
    font-size: 11.5px;
    letter-spacing: 0.1em;
    color: var(--seal);
    margin-bottom: 10px;
  }

  .warnings ul {
    margin: 0;
    padding: 0 0 0 15px;
    list-style: none;
    border-left: 2px solid var(--seal-line);
  }

  .warnings li {
    font-size: 13.5px;
    line-height: 1.72;
    color: var(--ink);
    padding-bottom: 12px;
    -webkit-user-select: text;
    user-select: text;
  }

  .warnings li:last-child { padding-bottom: 0; }

  /* ② 页的告警：标题一句话，下面最多三行（决定31）。同类合并成一句带计数的
     话 —— 原来第 88、120、156、233 章各占一行"一个段落都没有"，二十行里大半
     是同一句话换个章号。级别不显示成字，只决定先后（先丢东西的，后难看的）。
     这套只属于 ② 页（#r-warn-list），④ 页那份照旧走上面那套。

     放在右边一栏，左缘用一道发丝线跟账分开 —— 不是两张卡片，是一页纸的两栏。
     栏里那份 <ul> 自带左边框（.warnings ul 的 2px 印色线）在这里去掉：
     栏线已经隔开了，再来一道就成了框套框。 */
  #r-warnings {
    grid-column: 2;
    grid-row: 1;
    align-self: center;
    min-width: 0;
    padding-left: 34px;
    border-left: 1px solid var(--rule-soft);
  }

  #r-warnings .cap {
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.14em;
    margin-bottom: 20px;
  }

  #r-warn-list {
    padding-left: 0;
    border-left: 0;
    row-gap: 0;
  }

  #r-warn-list li {
    font-size: 14.5px;
    line-height: 1.95;
    color: var(--ink-2);
    padding-bottom: 16px;
    text-wrap: pretty;
  }

  #r-warn-list li:last-child { padding-bottom: 0; }

  /* 重跑回来的回执行：横跨整块内容区，落在账与陈情下面 */
  #view-result .r-note {
    grid-column: 1 / -1;
    grid-row: 2;
    margin-top: 24px;
  }

  /* 窄窗（<820）改成一栏：账在上、陈情在下，中间换成横线。
     820 这个数不是拍的：账 200 + 间距 64 + 告警最小 320 + 边距 236 ≈ 820。
     再窄下去右边那栏每行只剩十几个字，一句告警要折三行，就不如叠起来。
     叠起来之后整块仍在剩余空间里居中（align-content:center 管纵向）。 */
  @media (max-width: 820px) {
    #view-result .r-body {
      grid-template-columns: minmax(0, 1fr);
      row-gap: 26px;
    }

    #r-figures {
      grid-column: 1;
      grid-row: 1;
      max-width: 330px;
    }

    #r-warnings {
      grid-column: 1;
      grid-row: 2;
      padding-left: 0;
      border-left: 0;
      padding-top: 20px;
      border-top: 1px solid var(--rule-soft);
    }

    #r-warn-list li {
      font-size: 14px;
      line-height: 1.8;
      padding-bottom: 10px;
    }

    #view-result .r-note {
      grid-row: 3;
      margin-top: 18px;
    }
  }

  /* 空书提示：② 页整屏都是数字，「0 字 · 0 章」长得跟正常结果一模一样，
     用户拖错文件时看到的是一屏"成功"。这一条只在读不出正文时出现，放在
     账单上面 —— 先说"这本书是空的"，再给数字。 */
  .blanknote {
    font-size: 13.5px;
    line-height: 1.72;
    color: var(--ink);
    border-left: 2px solid var(--seal-line-2);
    background: var(--seal-fill);
    padding: 12px 15px;
    margin: 0 0 24px;
    -webkit-user-select: text;
    user-select: text;
  }

  /* 「只有图」不是异常：书里的字确实是 0，但打包出来是一本正常的画册，
     没有"需要人看一眼"的东西。朱砂框留给真出事的空书，这里换成灰的。 */
  .blanknote.calm {
    border-left-color: var(--rule);
    background: var(--hover);
  }

  /* ---- ③ 复核（校定） ----
     这一屏不是"读"也不是"扫"，是"过一遍"。

     左边一列竖目录，五类事实各占一行：删除 / 合并 / 切章 / 章节树 / 缺字。
     每类前面一枚 5px 的小灯，浅灰=还没看，浅绿=看过了。绿不是闸（决定21），
     它只是"我过了这一遍"的记账 —— 五盏都绿，右下角那颗按钮才转成绿底。

     右边是这一类的内容。点开一行才取那一行的上下文（决定24/25）：列表里
     只给 60 字摘要，正文一次都没进过界面；点哪行，才要哪行。
     每类先只拿前 40 行，滚到底再要下一段（决定27）。 */
  :root { --seen: #4A6A3E; }
  html[data-dark="1"] { --seen: #8CA478; }

  /* 返回键：一枚细箭头，贴在窗口左上角。它不属于版面，所以用 fixed ——
     它挡不到任何东西，也不会因为页面长短而移位。 */
  .sk-back {
    position: fixed; top: 0; left: 0; z-index: 30;
    margin: 12px 14px; padding: 6px; width: 34px; height: 34px;
    display: inline-flex; align-items: center; justify-content: center;
    background: none; border: none; color: var(--ink-3); cursor: pointer;
    border-radius: 3px; transition: color 140ms linear, background-color 140ms linear;
  }
  .sk-back:hover { color: var(--ink); background: var(--hover); }
  .sk-back svg { width: 20px; height: 20px; }

  .sk-sheet { padding: 58px 30px 16px; }
  .sheet.sk-sheet > .col { max-width: 980px; display: flex; flex-direction: column; min-height: 0; }

  .sk-seen { display: inline-block; width: 5px; height: 5px; border-radius: 50%;
             background: var(--ink-3); opacity: .45; transition: background-color 200ms linear, opacity 200ms linear; }
  .sk-seen.on { background: var(--seen); opacity: 1; }

  /* 列表与行 */
  .sk-list { list-style: none; margin: 0; padding: 0; }
  .sk-row { display: flex; align-items: center; gap: 12px; padding: 9px 6px 9px 0;
            border-bottom: 1px solid var(--row-line); font-size: 12.5px; cursor: pointer;
            transition: background-color 100ms linear; }
  .sk-row:last-child { border-bottom: none; }
  .sk-row:hover { background: var(--hover); }
  .sk-row.sel { background: var(--hover); }
  .sk-row .ln { flex: 0 0 64px; text-align: right; font-family: var(--sans); font-size: 11.5px;
                color: var(--ink-3); font-variant-numeric: tabular-nums; letter-spacing: .02em; }
  .sk-row .tx { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis;
                white-space: nowrap; color: var(--ink-2); }
  .sk-row .tag { flex: 0 0 auto; font-size: 10.5px; color: var(--ink-3); letter-spacing: .08em;
                 padding: 1px 5px; border: 1px solid var(--rule-soft); }
  .sk-row .keep { flex: 0 0 auto; display: flex; align-items: center; gap: 6px; font-size: 11px;
                  color: var(--ink-3); opacity: .62; transition: opacity 100ms linear; }
  .sk-row:hover .keep, .sk-row.kept .keep { opacity: 1; }
  .sk-row .keep input { margin: 0; appearance: none; -webkit-appearance: none;
    width: 13px; height: 13px; border: 1px solid var(--rule); border-radius: 2px;
    background: transparent; position: relative; cursor: pointer; }
  .sk-row .keep input:checked { background: var(--seal); border-color: var(--seal); }
  .sk-row .keep input:checked::after { content: ""; position: absolute; left: 3.5px; top: 0.5px;
    width: 3.5px; height: 6.5px; border-right: 1.5px solid var(--paper);
    border-bottom: 1.5px solid var(--paper); transform: rotate(40deg); }
  .sk-row.kept .tx { color: var(--seal); }

  /* 批量条 */
  .sk-bar { display: flex; align-items: center; gap: 14px; padding: 0 0 12px;
            font-family: var(--sans); font-size: 11.5px; color: var(--ink-3); letter-spacing: .04em; }
  .sk-bar .spacer { flex: 1; }
  .sk-act { background: none; border: none; padding: 3px 0; color: var(--ink-2);
            font-family: var(--sans); font-size: 11.5px; letter-spacing: .04em; cursor: pointer;
            border-bottom: 1px solid transparent; }
  .sk-act:hover { color: var(--ink); border-color: var(--ink-3); }

  /* 大标题：类名 + 数字 + 单位，一行。换类的时候它从上面轻轻落下来，
     读起来像翻过去一页，而不是刷一下换了内容。 */
  .sk-head { display: flex; align-items: baseline; gap: 14px; margin-bottom: 16px; }
  .sk-head .nm { font-size: 34px; line-height: 1.12; letter-spacing: .12em; }
  .sk-head .num { font-size: 34px; line-height: 1.12; font-variant-numeric: tabular-nums;
                  color: var(--ink-2); font-weight: 400; }
  .sk-head .unit { font-size: 11.5px; letter-spacing: .16em; color: var(--ink-3);
                   font-family: var(--sans); }
  .sk-head.rise { animation: sk-rise 320ms cubic-bezier(.2,.7,.2,1); }
  @keyframes sk-rise { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .sk-head.rise { animation: none; } }

  .b-body { flex: 1; min-height: 0; display: grid; grid-template-columns: 178px minmax(0,1fr); }
  .b-dir { border-right: 1px solid var(--rule-soft); padding: 2px 22px 0 0; }
  .b-dir button { display: flex; align-items: baseline; justify-content: space-between; gap: 10px;
                  width: 100%; padding: 11px 8px 11px 14px; background: none; border: none;
                  border-left: 2px solid transparent; cursor: pointer; text-align: left;
                  transition: background-color 110ms linear, border-color 110ms linear; }
  .b-dir button:hover { background: var(--hover); }
  .b-dir button.on { border-left-color: var(--ink); background: var(--hover); }
  .b-dir .nm { font-family: var(--serif); font-size: 13.5px; letter-spacing: .12em; color: var(--ink-2);
               white-space: nowrap; }
  .b-dir button.on .nm { color: var(--ink); }
  .b-dir .num { font-family: var(--sans); font-size: 15px; font-variant-numeric: tabular-nums;
                color: var(--ink-3); }
  .b-dir button.on .num { color: var(--ink); }
  .b-dir .sk-seen { align-self: center; margin-right: 2px; flex: 0 0 auto; }
  .b-dir button > .nm { flex: 1 1 auto; }
  .b-pane { min-height: 0; display: flex; flex-direction: column; padding-left: 32px; }
  .b-listwrap { flex: 1; min-height: 0; overflow-y: auto; margin-right: -14px; padding-right: 14px; }
  .b-inline { padding: 12px 0 18px 76px; border-bottom: 1px solid var(--row-line); }

  /* 左右对照：左原文，右改完的样子。对照本身说明一切，
     不需要一句"删掉 1 行，前后文不动" —— 对照已经足够。 */
  .cmp { display: grid; grid-template-columns: 1fr 1fr; border: 1px solid var(--rule);
         background: var(--paper); }
  .cmp-col { min-width: 0; padding: 13px 16px 15px; }
  .cmp-col + .cmp-col { border-left: 1px solid var(--rule-soft); }
  .cmp-cap { font-family: var(--sans); font-size: 11px; letter-spacing: .18em;
             color: var(--ink-2); margin-bottom: 12px; }
  .cmp-body p { margin: 0 0 8px; font-size: 13px; line-height: 1.95; color: var(--ink-2); }
  .cmp-body p:last-child { margin-bottom: 0; }
  .cmp-body .gl { display: inline-block; font-family: var(--sans); font-size: 10.5px;
                  font-variant-numeric: tabular-nums; color: var(--ink-3); opacity: .7;
                  margin-right: 10px; }
  .cmp-body p.gone { color: var(--seal); background: var(--seal-fill);
                     box-shadow: inset 2px 0 0 var(--seal); padding: 3px 9px 3px 12px;
                     margin-left: -12px; text-decoration: line-through;
                     text-decoration-color: var(--seal-line); text-decoration-thickness: 1px; }
  .cmp-body p.gone .gl { color: var(--seal); opacity: .65; }
  /* 只读类：左边是现场，宽一点；右边是"怎么了"，窄一点 */
  .cmp.ro { grid-template-columns: 1.45fr 1fr; }
  .cmp-body p.hot { color: var(--seal); background: var(--seal-fill);
                    box-shadow: inset 2px 0 0 var(--seal); padding: 3px 9px 3px 12px;
                    margin-left: -12px; }
  .cmp-body p.more { color: var(--ink-3); font-family: var(--sans); font-size: 11.5px;
                     letter-spacing: .04em; }
  .cmp-prose { font-size: 12.5px; line-height: 1.92; color: var(--ink-2); margin: 0; }
  .cmp-wait { font-family: var(--sans); font-size: 11.5px; letter-spacing: .06em;
              color: var(--ink-3); padding: 6px 0; }

  /* 缺字这一类的正文：一句说明，没有列表 —— 粒度按简版走，只报个数。 */
  .rv-note { font-size: 13px; line-height: 1.95; color: var(--ink-2); max-width: 620px;
             padding: 4px 0 0; }

  /* 校定：停着是描边（还没定下来），点下去描边收成实底，字往上翻成「装帧」。
     这不是"再点一次确认"，是转场 —— 翻完自己往下走。 */
  #btn-accept { padding: 12px 26px; min-width: 116px; }
  #btn-accept .flip { position: relative; display: block; overflow: hidden;
                      height: 1.35em; line-height: 1.35em; }
  #btn-accept .flip > span { display: block; transition: transform 320ms cubic-bezier(.2,.75,.2,1); }
  #btn-accept .flip .b { position: absolute; left: 0; right: 0; top: 0; transform: translateY(100%); }
  #btn-accept.go .flip .a { transform: translateY(-100%); }
  #btn-accept.go .flip .b { transform: translateY(0); }
  #btn-accept.go { background: var(--primary-bg); border-color: var(--primary-bg); color: var(--primary-fg); }
  /* 五盏灯全绿：绿底（印泥色）。绿不是闸 —— 它只说明"五类都过了眼"。 */
  #btn-accept.ready { background: var(--seen); border-color: var(--seen); color: var(--paper); }
  @media (prefers-reduced-motion: reduce) { #btn-accept .flip > span { transition: none; } }

  @media (max-width: 820px) {
    .b-body { grid-template-columns: 132px minmax(0,1fr); }
    .b-pane { padding-left: 18px; }
    .sk-head .nm, .sk-head .num { font-size: 29px; }
    .sk-head { margin-bottom: 12px; }
    .b-inline { padding: 10px 0 14px 0; }
    .cmp-col { padding: 10px 12px 12px; }
    .cmp-cap { margin-bottom: 9px; }
    .cmp-body p { font-size: 12.5px; line-height: 1.85; margin-bottom: 6px; }
  }

  /* 主按钮：墨色实底。**不用印色** —— 印色在这套界面里只有一个含义：
     需要人看一眼（警告）。把它同时当作"主色按钮"，会让人每次点主按钮
     都像在确认一个错误。 */
  .actions {
    display: flex;
    align-items: center;
    gap: 16px;
    border-top: 1px solid var(--rule-soft);
    margin-top: 18px;
    padding: 14px 0 0;
    /* 这里试过 `position: sticky; bottom: 0` 想让动作条永远在窗口底边，
       实测**不行**：sticky 是相对滚动祖先定位，而 .actions 是 .col 的最后
       一个子元素，它的包含块到头了，结果它照旧停在自然位置，下面已经滚上来的
       复选框文字从按钮底下露出来（截图可见）。真正可靠的做法只有两条：
       要么把动作条挪出滚动区（结构改动，四个视图都要动），要么把内容压到
       一屏内（下面这些间距就是这么定下来的）。选了后者。 */
  }

  button {
    font-family: var(--sans);
    font-size: 13.5px;
    letter-spacing: 0.04em;
    border-radius: 0;
    cursor: pointer;
    transition: background-color 100ms linear, color 100ms linear, border-color 100ms linear;
  }

  .primary {
    padding: 12px 30px;
    background: var(--primary-bg);
    color: var(--primary-fg);
    border: 1px solid var(--primary-bg);
  }

  .primary:hover { background: var(--primary-hover); border-color: var(--primary-hover); }
  .primary:disabled { background: var(--ink-3); border-color: var(--ink-3); cursor: default; }

  .ghost {
    padding: 12px 22px;
    background: transparent;
    color: var(--ink);
    border: 1px solid var(--rule);
  }

  .ghost:hover { border-color: var(--ink-2); }

  .quiet {
    padding: 12px 2px;
    background: none;
    border: none;
    color: var(--ink-2);
    border-bottom: 1px solid transparent;
  }

  .quiet:hover { color: var(--ink); border-color: var(--ink-2); }

  .spacer { flex: 1; }

  /* ---------- ④ 元数据与封面 ----------
     这一页是"书的版权页"，不是设置面板。所以：
     · 书名是整页最大的字，点进去就能改（不是表单里的一行小字）；
     · 封面在左、文字在右 —— 眼睛先看到书，再看到参数；
     · 作者与语言同排一行，它们同级且次要；
     · 字体 / AZW3 / 输出目录收进「更多选项」，默认展开的是"这本书是什么"。
     旧版是六条全宽横带（标签+输入框+说明）逐条往下堆，读起来像注册表单 ——
     信息一条不少，但每一行都在抢同样的注意力。 */
  /* 两栏：封面 | 书文。左栏宽度**不写死** —— 封面大小跟着窗口高度走
     （见 .cover-stage），写死 272px 就会出现"高度装不下、宽度还占着"，
     720×520 下正是这样溢出 54px 的。 */
  .meta-grid {
    display: grid;
    grid-template-columns: auto minmax(0, 1fr);
    gap: 0 44px;
    align-items: stretch;
    padding-top: 2px;
  }

  /* 左栏只负责"站在那儿"，高度由右栏决定（grid 拉伸）。
     封面自己不去推高左栏 —— 它用百分比高度，在内在尺寸计算里等于 0，
     于是行高只由右栏的文字与小样说了算。这条链上不能有"子撑父、
     父又定子"的环，一环就翻车（试过 flex:1，画框变 258×388 不成比例）。 */
  .meta-cover { display: flex; flex-direction: column; min-height: 0; }

  /* 画框：高度对左栏负责，宽度由 3:4 反推 ——
     左栏由 grid 拉伸成与右栏等高，所以"画的底边"永远和"小样带的底边"
     是一条线（这一页最要紧的一条横线）。
     只给高度、不给宽度：两个尺寸都定住时 aspect-ratio 就作废了。
     试过让它 flex:1 去撑左栏 —— 左栏高度本来是它定的，一撑就成环，
     实测画框变成 258×388（不成 3:4），画面被塞进白边里。 */
  .cover-stage {
    position: relative;
    height: 100%;
    width: auto;
    align-self: flex-start;
    aspect-ratio: 3 / 4;
    /* 这里**不能**写 max-height / max-width。写过 506×380 那一版：
       右栏自然高 516，画却被 380 宽反推成 506.67 高，于是画框底边比
       右栏底边高 10px —— 这一页最要紧的那条横线就这么断了
       （1040×760 / 1600×900 / 1400×1000 全部差 10）。
       画宽本来就是 0.75 × 右栏高，右栏最宽时字列仍有 520 以上，不缺字宽。 */
  }

  .cover-frame {
    position: absolute;
    inset: 0;
    border: 1px solid var(--rule);
    background: var(--paper-2);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .cover-frame img { width: 100%; height: 100%; object-fit: contain; display: block; }

  /* 版式名压在画面下沿：它是"这一张是谁"的答案，该贴着画，
     而不是在画下面另起一行自报家门。 */
  .cover-cap {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    display: flex; align-items: baseline; gap: 6px;
    padding: 7px 10px 6px;
    font-family: var(--sans); font-size: 11.5px; letter-spacing: .04em;
    color: #F1EFE8;
    background: linear-gradient(to top, rgba(14, 15, 17, 0.74), rgba(14, 15, 17, 0));
    pointer-events: none;
  }
  .cover-cap[hidden] { display: none; }

  .cover-frame .empty {
    font-family: var(--sans);
    font-size: 11.5px;
    color: var(--ink-3);
    letter-spacing: 0.08em;
    text-align: center;
    line-height: 1.7;
    white-space: pre-line;
  }

  /* 封面下的四个动作。上一版是 12px / padding 7×11 —— 那是"词"的规格，
     跟主按钮「付梓」差着三倍体量，而挑封面正是这一页的正事。
     现在它们是按钮：40 高、13.5px（跟全站 button 同档），比「付梓」矮半档，
     层级是"这是正事" < "这是最后一步"。
     它们跟右栏底边对齐，靠的不是自己的 auto margin（那会跟"更多选项"抢同一截
     空白，把空白劈成两半），而是上面的 .more 吃掉了全部余量 ——
     于是"更多选项 + 封面动作"这一组整体沉到底，四个动作的下沿仍然与封面下沿
     落在同一条横线上。 */
  .cover-tools {
    margin-top: 26px;
    display: flex;
    flex-direction: column;
  }

  .cover-actions {
    display: flex;
    flex-wrap: wrap;
    align-items: stretch;
    gap: 8px;
  }

  .cover-actions button {
    flex: 0 1 auto;
    min-height: 40px;
    padding: 10px;
    font-family: var(--sans);
    font-size: 13.5px;
    background: none;
    color: var(--ink-2);
    cursor: pointer;
    border: 1px solid var(--rule);
    letter-spacing: 0.04em;
  }

  .cover-actions button:hover { color: var(--ink); border-color: var(--ink-2); }
  /* 当前那一款：墨底反白，跟"这一张就是它"同一口气。 */
  .cover-actions button.on {
    background: var(--primary-bg); border-color: var(--primary-bg); color: var(--primary-fg);
  }

  .cover-actions .pick-name {
    min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }

  #cover-note {
    margin-left: auto;
    flex: 0 1 auto;
    min-width: 0;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    font-family: var(--sans); font-size: 11px; letter-spacing: .03em;
    color: var(--ink-3);
    text-align: right;
  }
  #cover-note[hidden] { display: none; }

  /* 右栏是 flex 列：文字在上、样张带贴底吃掉剩余高度。
     这样两栏永远等高 —— 窗口变高时多出来的高度落在"大封面"和
     "样张带"上，而不是在右栏底下摊成一片白。 */
  .meta-main { min-width: 0; display: flex; flex-direction: column; }

  .title-label,
  .pair-item label,
  .outdir-row label {
    display: block;
    font-family: var(--sans);
    font-size: 11px;
    letter-spacing: 0.12em;
    color: var(--ink-3);
    margin-bottom: 4px;
  }

  /* 书名：没有输入框，只有一条线。它决定成品文件名，所以它是这一页的主角。
     36px 是量出来的：30px 时它跟下面「作者 / 语言」只差 16px，读起来是一组输入框；
     36px 才压得住场面，又不会把右栏撑高到和封面对不上。 */
  .title-input {
    width: 100%;
    border: none;
    border-bottom: 1px solid var(--rule-soft);
    background: transparent;
    padding: 2px 0 10px;
    color: var(--ink);
    font-family: var(--serif);
    font-size: 36px;
    line-height: 1.25;
    letter-spacing: 0.01em;
    -webkit-user-select: text;
    user-select: text;
  }

  .title-input:focus { outline: none; border-bottom-color: var(--ink); }

  .pair {
    display: flex;
    gap: 26px;
    margin-top: 40px;
  }

  .pair-item { flex: 1 1 auto; min-width: 0; }
  .pair-item.narrow { flex: 0 0 132px; }

  .pair-item input {
    width: 100%;
    border: none;
    border-bottom: 1px solid var(--rule-soft);
    background: transparent;
    padding: 3px 0 7px;
    color: var(--ink);
    font-family: var(--serif);
    font-size: 14px;
    letter-spacing: 0.02em;
    -webkit-user-select: text;
    user-select: text;
  }

  .pair-item input:focus { outline: none; border-bottom-color: var(--ink); }
  .pair-item input::placeholder { color: var(--ink-3); }

  /* 一行字据：不加发丝线、不拉大间距 —— 它只是"打包的是这份"，
     不是又一个区块。（原来它上面那道线 + 40px 间距，是给一屏装不下
     找的借口。） */
  /* ④ 页的返回键：跟 ③ 复核页同款的那枚 .sk-back，贴在窗口左上。
     两处偏移是量出来的，不是估的：
     · 页码条右让 34px —— 正好是箭头那块命中区，也是 ③ 里箭头到正文的
       那段空隙。箭头留在页边，字从版心起头，两者互不挤。
     · 箭头再往下 4px（12 → 16）—— 它旁边是 11px 的页码，墨迹中心比箭头
       低 4.5px。不挪的话，箭头单独看没问题，跟小字并排就浮在半空。
     这两条都不改版面高度，所以 720×520 那点零余量不会被吃掉。 */
  #view-meta .sk-back { margin-top: 16px; }
  #view-meta .pagetop { padding-left: 34px; }

  /* ⑤ 页的 .scroll 是唯一一页需要"长大"的：这一页的主体是一张画，
     画本来就该跟窗口一起长。别的页内容是字，字不会因为窗口变高而变大，
     所以那边保持 flex:0 1 auto（内容短时动作条紧跟内容，别推到底边）。 */
  #view-meta .scroll {
    flex: 1 1 auto;
    display: flex;
    flex-direction: column;
  }

  /* 生长与收缩两条规则，缺一不可：
     · grow = 1：这一页的主体是一张画，画该跟窗口一起长。右栏的按钮被
       margin-top:auto 顶到底边，中间多出来的高度全给左栏那张画 ——
       窗口变高时"字和按钮不动、画变大"，而不是右栏底下摊一片白。
     · shrink = 0：写成可缩时，展开「更多选项」右栏变高、栅格被压到 420，
       可里面那张画还按 496 排 —— 画的下半截伸到可视区外面去了
       （1013×580 探针实测画框底 565、栅格底 487）。压扁不等于裁切：
       溢出的部分谁也拿不到。不许缩，让 .scroll 滚，展开态才摸得到底。 */
  #view-meta .meta-grid {
    flex: 1 0 auto;
    min-height: 0;
    /* 画能长，但有尽头：450 高 = 336 宽。
       这个上限不是"够不够大"的问题，是"这一页的主语是谁"的问题 ——
       540 的时候画占了左半屏整整 538 高，书名被衬成一行小字，
       这一页读起来像"封面下载页"；压到 450，画仍然是这一页最大的一块，
       但书名和它站在同一量级，两个都是主角。
       450 也是量出来的：压到这里，右栏「书名 / 作者 / 语言 / 一行数据」
       与「更多选项 + 三个封面动作」之间的空隙约 110px，
       刚好是一道换气，不是漏了一块（540 时那截是 215px，太大了）。
       多出来的高度由上下两条 auto margin 均分，
       所以窗口极高时是"四周留白"，不是"底下摊一片白"（那才是原来那个病）。 */
    max-height: 450px;
    margin-top: auto;
    margin-bottom: auto;
  }

  .meta-facts {
    font-family: var(--sans);
    font-size: 12px;
    color: var(--ink-3);
    letter-spacing: 0.03em;
    margin-top: 32px;
  }

  /* 更多选项：默认收起。summary 里带着当前输出目录，
     所以"收起来"不等于"藏起来" —— 一眼能看出成品会落在哪。

     那一大截 auto margin 是这页排版的关键。右栏的内容只有两百来高，
     而它要陪左边四百高的封面站到底，中间必然要空出一截 —— 空在哪决定了
     它读作什么：夹在书名的输入框和作者的输入框之间，读起来像漏了一块；
     放在"这本书是谁"和"我要对它做什么"之间，读起来是换气。
     上面那条发丝线就是这条分界，它同时也是展开态的边界（展开后 auto
     margin 归零，线仍把「操作区」和「信息区」隔开）。

     ★ 别再往右栏里塞东西去填这截白。填了就变成"这一页很满"，
       而这一页要的恰恰是"就这些东西"。 */
  .more {
    margin-top: auto;
    padding-top: 22px;
    border-top: 1px solid var(--rule-soft);
  }

  .more > summary {
    display: flex;
    align-items: baseline;
    gap: 10px;
    font-family: var(--sans);
    font-size: 12px;
    color: var(--ink-2);
    letter-spacing: 0.04em;
    cursor: pointer;
    list-style: none;
    padding: 8px 0 4px;
  }

  .more > summary::-webkit-details-marker { display: none; }
  .more > summary::before {
    content: "＋";
    font-family: var(--sans);
    font-size: 11px;
    color: var(--ink-3);
    width: 11px;
    flex: 0 0 auto;
  }
  .more[open] > summary::before { content: "－"; }
  .more > summary:hover { color: var(--ink); }

  /* 标签不许换行（第一版被压成"更多选/项"），能被压缩的只有右边那截路径。 */
  .more > summary > span:first-child {
    flex: 0 0 auto;
    white-space: nowrap;
  }

  .more-note {
    flex: 1 1 auto;
    min-width: 0;
    font-size: 11px;
    color: var(--ink-3);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  /* 收起时这一行是唯一能看见的"当前值"（输出到哪儿），展开后下面那行
     把同一件事说全了 —— 留着就是同一句话并排两遍。 */
  .more[open] .more-note { display: none; }

  .more-body { padding: 6px 0 2px 21px; }

  /* 两个复选框：默认值是"嵌字体、不转 AZW3"，说明只在需要时读，
     所以字小、灰、贴着复选框，不占独立行。 */
  .check-row {
    display: flex;
    align-items: flex-start;
    gap: 9px;
    margin-top: 9px;
    font-family: var(--sans);
    font-size: 12px;
    color: var(--ink-2);
    line-height: 1.65;
    cursor: pointer;
    letter-spacing: 0.03em;
  }

  .check-row input { margin-top: 2px; accent-color: var(--ink); }

  .outdir-row {
    display: flex;
    align-items: baseline;
    gap: 12px;
    margin-top: 16px;
  }

  .outdir-row label { flex: 0 0 auto; margin-bottom: 0; }

  .outdir-row input[type="text"] {
    flex: 1 1 auto;
    min-width: 0;
    border: none;
    border-bottom: 1px solid var(--rule-soft);
    background: transparent;
    padding: 3px 0 6px;
    color: var(--ink-2);
    font-family: var(--sans);
    font-size: 11.5px;
    letter-spacing: 0.02em;
    -webkit-user-select: text;
    user-select: text;
  }

  .outdir-row input[type="text"]:focus { outline: none; border-bottom-color: var(--ink); }

  .outdir-row .quiet {
    flex: 0 0 auto;
    font-family: var(--sans);
    font-size: 11.5px;
    padding: 0 0 3px;
    border: none;
    background: none;
    color: var(--ink-2);
    border-bottom: 1px solid var(--rule);
    cursor: pointer;
    letter-spacing: 0.04em;
  }

  .outdir-row .quiet:hover { color: var(--ink); border-bottom-color: var(--ink); }

  /* ---------- ⑤ 完成 ----------

     这一页的形状是"一本书摆在你面前"：左边是它，右边是它叫什么、谁写的、
     哪里可能不对。跟 ④ 页同一个骨架（画在左、字在右），因为这两页说的是
     同一件事的两头 —— ④ 是"它将要长成这样"，⑤ 是"它已经长成这样了"。

     上一版没有画：一屏灰字加两个按钮，读起来像一张发票。用户拿到的是一个
     文件，可这个文件是他等了十分钟换来的、有封面有书名的一本书，界面上却
     一点"书"的样子都不给。封面这次是真打进包里的那一张（payload.cover），
     不是又一版预览。 */

  /* 这一页内容天然矮（一本封面加三行字）。顶对齐会在底下剩两百多像素，
     整页读作"上面挤了一坨、下面是空的"。④ 页的做法是把栅格上下 auto 均分，
     但那一页的父级（.scroll）被内容撑满了；这一页的 .scroll 是 flex:0 1 auto，
     没有余量可分，所以要让滚动区自己变成纵向居中容器。 */
  #view-done .scroll {
    display: flex;
    flex-direction: column;
    /* 让滚动区吃满余量，居中交给栅格自己的 margin:auto 0 —— 不用
       justify-content:center，那会把「05 完成」也一起挪到半空，
       而那一行是"这是第几步"，不是这一页的内容。 */
    flex: 1 1 auto;
  }

  .done-grid {
    display: grid;
    grid-template-columns: auto minmax(0, 1fr);
    gap: clamp(28px, 4.2vw, 52px);
    /* 右栏只有三行字，封面却有 440 高。顶对齐时右栏那三行悬在封面顶上，
       底下空一截像漏了什么；居中对齐让"书名"落在封面竖轴的中点附近，
       与 ④ 页书名压着封面顶部那条线不同 —— 那页右栏满，这页不满。 */
    align-items: center;
    /* 上下 auto 均分：页码留在顶上，栅格落在余下空间的中间。
       （这一页内容天然比视口矮。不加这句，1040×760 底下会剩 280px 白，
       整页读作"上面挤了一坨、下面是空的"。） */
    margin: auto 0;
  }

  /* 画框高度，宽度由 3:4 反推。上限 420 是因为再高就是在展览封面；
     下限 200 是 720×520 里还认得出封面上写了什么。 */
  .done-stage {
    position: relative;
    height: clamp(200px, 54vh, 440px);
    aspect-ratio: 3 / 4;
  }

  .done-frame {
    position: absolute;
    inset: 0;
    border: 1px solid var(--rule);
    background: var(--paper-2);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .done-frame img { width: 100%; height: 100%; object-fit: contain; display: block; }

  .done-frame .empty {
    font-family: var(--sans);
    font-size: 11.5px;
    color: var(--ink-3);
    letter-spacing: 0.08em;
    text-align: center;
    line-height: 1.7;
    white-space: pre-line;
  }

  .done-main { min-width: 0; display: flex; flex-direction: column; }

  /* 与 ④ 页的书名同档：那页是"确认它叫什么"，这页是"它就叫这个"。 */
  .done-title {
    font-family: var(--serif);
    font-size: 36px;
    line-height: 1.25;
    letter-spacing: 0.02em;
    font-weight: 400;
    margin: 0;
    word-break: break-word;
  }

  /* 作者、篇幅、另存 —— 都带标签。上一版是"甘草 · 893 章 · 203,826 段"
     一行三节，读起来像一行小字报；而且段数是 ③ 页已经删掉的指标，
     跑到最后一页又冒出来一次。 */
  .done-kv {
    display: grid;
    grid-template-columns: 60px minmax(0, 1fr);
    gap: 4px 14px;
    align-items: baseline;
    margin-top: 14px;
  }

  .done-kv:first-of-type { margin-top: 26px; }

  .done-kv[hidden] { display: none; }

  .done-kv dt {
    font-family: var(--sans);
    font-size: 11px;
    letter-spacing: 0.12em;
    color: var(--ink-3);
  }

  .done-kv dd {
    margin: 0;
    font-size: 14px;
    color: var(--ink);
    line-height: 1.6;
    word-break: break-word;
  }

  .done-kv dd.muted { color: var(--ink-3); }

  /* 告警（决定31/32）：同类合并成一句带计数的短话，按"丢了 / 会跳错 / 只是难看"
     三级排。级别不写成"数据丢失级"这种词 —— 左边那根竖线就是级别：
     印色是内容真缺了，墨色是结构错了，浅灰是书照读不误。
     没有要说的就整块不出现。 */
  .done-alerts {
    margin-top: 30px;
    border-top: 1px solid var(--rule-soft);
    padding-top: 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .done-alert {
    display: grid;
    grid-template-columns: 2px minmax(0, 1fr);
    gap: 14px;
    align-items: stretch;
  }

  .done-alert::before { content: ""; display: block; background: var(--ink-3); }
  .done-alert[data-lv="loss"]::before { background: var(--seal); }
  .done-alert[data-lv="order"]::before { background: var(--ink-2); }

  .done-alert p {
    margin: 0;
    font-family: var(--sans);
    font-size: 12.5px;
    line-height: 1.8;
    color: var(--ink-2);
    word-break: break-word;
  }

  .done-alert[data-lv="loss"] p { color: var(--ink); }

  /* [hidden] 的 display:none 敌不过上面那条 display:flex ——
     干净的书会因此多出一条横线和 20px 空白，看着像"这里本该有话被吞了"。 */
  .done-alerts[hidden] { display: none; }

  /* 出口：两个真按钮一行，后门是"打开这本书"底下那行虚线的字。
     虚线不是装饰 —— 它说"这是一条小路"，跟实底/描边的两级按钮区分开。 */
  .done-exit { display: flex; flex-direction: column; align-items: flex-end; gap: 9px; }
  .done-exit-row { display: flex; align-items: center; gap: 16px; }
  .dashed {
    border: none;
    background: none;
    padding: 0 0 2px;
    font-size: 12px;
    letter-spacing: .06em;
    color: var(--ink-3);
    border-bottom: 1px dashed var(--rule);
  }
  .dashed:hover { color: var(--ink); border-bottom-color: var(--ink-2); }

  /* 矮窗口（720×520 与 1013×580）下，这一页的告警要挤进一屏。
     规格要求不滚动，装不下就得让位 —— 让的是间距，不是内容。
     省出来的三处：告警区的上下留白、动作条的上边距、两个出口按钮之间的缝。 */
  @media (max-height: 600px) {
    .done-alerts { margin-top: 20px; padding-top: 14px; gap: 10px; }
    #view-done .actions { margin-top: 12px; padding-top: 10px; }
    .done-exit { gap: 6px; }
  }

  /* ---------- 错误视图 ----------
     这一页以前是「620 宽的窄栏居中吊在半空、右下角一颗『换一个文件』」。
     三个毛病：①右边空 400px，读起来像一张没填完的表；②它没有页码条，
     跟其余五页的顶边全错开；③不管出什么事都只有「换一个文件」一个出口 ——
     可实际情况是：④ 页打包失败，用户想的是「我回去改改再付梓」；
     ⑤ 页打不开阅读器，用户想的是「书就在那儿，帮我打开目录」；
     「换一个文件」在这两种时候等于把刚做好的东西扔了。
     现在它跟其余页同构：顶边一条页码（知道自己是第几步被打断的）、
     正文左边一道朱红竖线（跟完成页告警是同一套语言：红竖线 = 这里有问题）、
     出口在右下角，按上下文给一到两颗。 */
  .err-head {
    display: grid;
    grid-template-columns: 2px minmax(0, 1fr);
    gap: 18px;
    align-items: stretch;
  }

  .err-head::before {
    content: "";
    display: block;
    background: var(--seal);
  }

  .err-head-in { min-width: 0; }

  .err-title {
    font-size: 26px;
    line-height: 1.3;
    margin: 0 0 10px;
    font-weight: 400;
    word-break: break-word;
  }

  .err-body {
    font-family: var(--sans);
    font-size: 14px;
    line-height: 1.8;
    color: var(--ink-2);
    white-space: pre-wrap;
    word-break: break-word;
    -webkit-user-select: text;
    user-select: text;
    margin: 0;
  }

  /* 技术细节：类名和异常原文不进正文，收在这个折角里。
     默认关着 —— 出事的时候人要看的是「怎么办」，不是「哪一行」。 */
  .err-more { margin-top: 24px; }
  .err-more[hidden] { display: none; }

  .err-more > summary {
    font-family: var(--sans);
    font-size: 11.5px;
    letter-spacing: .1em;
    color: var(--ink-3);
    cursor: pointer;
    list-style: none;
    display: inline-block;
  }

  .err-more > summary::-webkit-details-marker { display: none; }
  .err-more > summary::before { content: "＋ "; }
  .err-more[open] > summary::before { content: "－ "; }
  .err-more > summary:hover { color: var(--ink-2); }

  .err-more pre {
    margin: 12px 0 0;
    padding: 12px 14px;
    background: var(--paper-2);
    font-family: ui-monospace, Consolas, "Courier New", monospace;
    font-size: 11.5px;
    line-height: 1.7;
    color: var(--ink-2);
    white-space: pre-wrap;
    word-break: break-all;
    -webkit-user-select: text;
    user-select: text;
    max-height: 168px;
    overflow: auto;
  }

  /* 出口钉在底边，跟其余五页一样。
     ★ 这一行不能省：`.sheet .scroll` 默认是 flex:0 1 auto（只占内容高），
     错误页的内容通常只有两三行，于是 .actions 会跟着内容浮在页面上半截，
     下面是七百像素的白 —— 同一个按钮，在别的页在右下角，在这一页在半空。
     让滚动区吃掉余下的高度，出口就自然沉到底了。 */
  #view-error .scroll { flex: 1 1 auto; display: flex; flex-direction: column; }

  /* 内容居栏宽的一半：两侧各留一道等宽的边，读起来是「一张便条」而不是
     「一张没填完的表」。620 是这句话的读宽上限 —— 再宽，一行要横跨整个窗口，
     人眼回行会丢行。 */
  #view-error .err-main { align-self: center; max-width: 620px; width: 100%; }

  /* 页码条跟着内容一起居中。它读的是「我在第几步被打断」，
     跟下面这句「出了什么事」是同一块东西的两行 —— 一个钉在最左、
     一个浮在中间，中间那道横跨两百像素的空档会把它们拆成两件事。 */
  #view-error .pagetop { align-self: center; max-width: 620px; width: 100%; }

  /* 一句话 + 一颗按钮，中间空七百像素 —— 那不是留白，那是没排完。
     把标题块放在滚动区的垂直中线上：上面是页码（我在第几步被打断），
     下面是出口（接下来怎么办），中间这句是「出了什么事」。三段各归其位。
     ★ 用 auto margin 而不是 justify-content:center —— 后者在内容超高时
     会把顶上一截顶出可视区、还滚不回去；auto margin 在没余量时归零，
     自然退化成顶对齐。 */
  .err-main { margin: auto 0; }

  /* 出口：跟完成页同一个骨架（主按钮在上、虚线小字在下，都靠右）。
     原本还套了一层 .err-exit-row 放「换一个文件 + 再试一次」并排 ——
     可「再试一次」从来没有一处调用点给过 again，那颗按钮永远 hidden，
     于是 row 里恒剩一颗，「并排」这个结构没有任何时候成立过。撤掉。 */
  .err-exit { display: flex; flex-direction: column; align-items: flex-end; gap: 9px; }

  @media (max-height: 600px) {
    .err-title { font-size: 22px; }
    .err-body { font-size: 13.5px; line-height: 1.7; }
    .err-more { margin-top: 18px; }
    .err-more pre { max-height: 120px; }
    #view-error .actions { margin-top: 12px; padding-top: 10px; }
    .err-exit { gap: 6px; }
  }

  /* 滚动条压细，别在纸上出现一根粗条 */
  ::-webkit-scrollbar { width: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--thumb); }
  ::-webkit-scrollbar-thumb:hover { background: var(--thumb-hover); }
</style>
</head>
<body data-view="drop">

<div class="chrome">
  <button class="theme-btn" id="btn-theme" type="button" aria-label="主题">
    <svg width="15" height="15" viewBox="0 0 16 16" fill="none"
         stroke="currentColor" stroke-width="1.2" stroke-linecap="round">
      <path d="M8 1.6v1.5M8 12.9v1.5M1.6 8h1.5M12.9 8h1.5M3.5 3.5l1 1M11.5 11.5l1 1M12.5 3.5l-1 1M4.5 11.5l-1 1"/>
      <circle cx="8" cy="8" r="2.9"/>
    </svg>
  </button>
</div>

<!-- ① 导入 -->
<div class="view" id="view-drop">
  <main>
    <div id="drop-area">
      <!-- 墨团：一个跟手走的墨晕 + 一圈荡开的环。都在 .marks 下面、正文上面。 -->
      <div class="bloom" aria-hidden="true"></div>
      <div class="ripple" aria-hidden="true"></div>

<!-- 关于：一块牌记。整屏只有一枚印和一行版本号，Esc 或点空白处回首页。 -->
<div class="view" id="view-about">
  <main>
    <div class="ab-mark"></div>
    <div class="ab-ver" id="ab-ver"></div>
  </main>
