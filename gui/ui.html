<script>
(function () {
  "use strict";

  // pywebview 注入的桥在 pywebviewready 之后才可用。所有调用前先等它。
  var bridgeReady = false;
  var pendingPath = null;   // 桥还没好时拖进来的文件先存这儿
  var currentJob = null;
  var currentPayload = null;
  // 用户在 ④ 页手动动过「内嵌字体」这个勾没有。动过之后 renderMeta 就不再拿
  // 默认值覆盖他的选择（重进 ④ 页、校定、重跑都会重画这一页）；换一本书时清回 false。
  var fontsTouched = false;
  var pollTimer = null;

  var el = function (id) { return document.getElementById(id); };

  // 五个视图就是流程的五步（docs/gui-design.md 的「视图」一节）。复核那一步是可选的，
  // 但它确实是流程里的一站，跳过它不改变后面是第几步 —— 编号跟着视图走，
  // 不跟着"走了几条路"走，否则同一步在不同路径下编号不同，更让人迷惑。
  // 号码写在页面左上角（.pgno），不写在顶栏：顶栏只放"这是什么程序"，
  // "我走到哪了"属于这一页的内容。号码写成两位（02），不写"2 / 5"。
  var STEP_OF = { result: 2, review: 3, meta: 4, done: 5 };
  var STEP_NAME = { 1: "拖进一本书", 2: "看清洗结果", 3: "复核删改", 4: "确认书名与封面", 5: "完成" };

  function setView(name) {
    // 离开这一屏就把它的定时器全掐掉，否则轮换文案会一直在后台跑。
    if (name !== "busy") { busyLeave(); }
    document.body.setAttribute("data-view", name);
    var n = STEP_OF[name];
    if (!n) { return; }
    var host = el("view-" + name);
    if (!host) { return; }
    var no = host.querySelector(".pgno");
    var nm = host.querySelector(".pgname");
    if (no) { no.textContent = (n < 10 ? "0" : "") + n; }
    if (nm) { nm.textContent = STEP_NAME[n]; }
  }

  function text(node, s) { node.textContent = s; }

  function num(n) {
    return (n === null || n === undefined || n === "") ? "—" : Number(n).toLocaleString("zh-CN");
  }

  // 文件大小：按量级换单位。
  // 「0.00 MB」对小文件是废信息 —— 一本 200KB 的短篇会显示成"0.00 MB"，
  // 看上去像没读到文件。阈值放在 1 KB / 1 MB 两档，其余保留一位小数。
  function bytes_human(n) {
    if (n === null || n === undefined || isNaN(n)) { return "—"; }
    var b = Number(n);
    if (b < 1024) { return b + " B"; }
    if (b < 1024 * 1024) { return (b / 1024).toFixed(b < 10240 ? 1 : 0) + " KB"; }
    return (b / 1024 / 1024).toFixed(b < 10 * 1024 * 1024 ? 1 : 0) + " MB";
  }

  // ---------- 与后端说话 ----------

  function api() {
    return (window.pywebview && window.pywebview.api) ? window.pywebview.api : null;
  }

  // 兜底页面。三件事必须分开说：
  // ①**是什么**（标题）+ **该怎么办**（正文）—— 都是人话，类名与异常原文不进正文；
  // ②**技术细节**收在折角里，默认关着，出问题时人要的是「怎么办」不是「哪一行」；
  // ③**出口按上下文给**：从 ④ 页打包失败退回去是「回上一步」，不是「换一个文件」——
  //   后者会把 currentJob/currentPayload 清空，用户刚拖进来的书、刚改好的书名全没了。
  // 早先全页只有一个「换一个文件」，21 处调用点不管出什么事都把人踢回首页，
  // 最严重的是 ⑤ 页打不开阅读器 —— 成品就在盘上，界面却把这一场会话忘了。
  var errBack = null;     // { view, label }
  var errReveal = "";     // 目录或文件路径
  var errContinue = null; // 函数：默认拒收、但用户可以硬来（目前只有整本糊行）

  function showError(title, body, opts) {
    opts = opts || {};
    stopPolling();
    text(el("e-title"), title || "没能处理这个文件");
    text(el("e-body"), body || "");

    // 按下这一页时人在第几步 —— 页码条让人知道「是哪一步断的」。
    var step = opts.step || 0;
    var stepName = opts.stepName || "出问题了";
    el("e-no").textContent = step ? (step < 10 ? "0" + step : String(step)) : "00";
    el("e-name").textContent = stepName;

    // 技术细节
    var detail = String(opts.detail || "");
    var more = el("e-more");
    el("e-detail").textContent = detail;
    more.hidden = !detail;
    more.open = false;

    // 出口 1：退回去（不清会话）或换一个文件（清会话）
    errBack = opts.back || null;
    var backBtn = el("btn-back");
    if (errBack) {
      backBtn.className = "ghost";
      backBtn.textContent = errBack.label || "回上一步";
    } else {
      backBtn.className = "primary";
      backBtn.textContent = "换一个文件";
    }

    // 出口 2：打开所在目录（成品还在盘上的时候）
    errReveal = String(opts.reveal || "");
    el("btn-err-reveal").hidden = !errReveal;

    // 出口 3：仍然继续（默认拒收、但用户可以硬来的那一种 —— 现在只有整本糊行）。
    // 这颗按钮的文案是固定的，不随 opts 变：它表达的永远是"我知道有问题，还是要做"。
    errContinue = typeof opts.continue === "function" ? opts.continue : null;
    el("btn-err-continue").hidden = !errContinue;

    setView("error");
  }

  function stopPolling() {
    if (pollTimer) { clearTimeout(pollTimer); pollTimer = null; }
  }

  // ★ 回来的时候先认门牌：jobId 必须还是当前活跃的那个。
  //   stopPolling() 只清得掉 setTimeout，清不掉已经在飞的 promise ——
  //   用户点了取消（activeJobId 置空、回上一屏），三百毫秒后那个 promise
  //   照样会落地：done=false 就自己把轮询接回来（取消等于没取消），
  //   done=true 就直接把用户弹回结果页。两道门都要查。
  function poll(jobId, onDone) {
    var a = api();
    if (!a) { showError("界面没有连上后端", "pywebview 的桥没有注入成功。请重启程序；如果反复出现，说明打包缺了 webview 的 hooks。",
      { step: 2, stepName: "看清洗结果" }); return; }
    a.job_poll(jobId).then(function (res) {
      if (jobId !== activeJobId) { return; }
      if (!res) { showError("后端没有回应", "job_poll 返回了空值。", { step: 2, stepName: "看清洗结果" }); return; }
      if (res.error) {
        var errOpts = { step: 2, stepName: "看清洗结果", detail: res.error_detail };
        // 后端标了「默认拒收、但用户可以硬来」（现在只有整本糊行这一类），
        // 就把错误页的「仍然继续」亮出来 —— 点的还是这次被拒的那个 jobId，
        // 后端靠它在会话表里找回同一本书。
        if (res.can_continue) {
          errOpts.continue = function () { forceImport(jobId); };
        }
        showError(res.error_title || "清洗失败", res.error, errOpts);
        return;
      }
      if (res.done) {
        stopPolling();
        // onDone：跑完之后去哪一屏由调用者决定（改样之后直接进 ④，
        // 而不是先回 ③ 再让人点一次）。
        if (onDone) { onDone(res.payload); } else { render(res.payload); }
        return;
      }
      pollTimer = setTimeout(function () { poll(jobId, onDone); }, 300);
    }).catch(function (err) {
      if (jobId !== activeJobId) { return; }
      showError("轮询出错", "等这本书的时候，界面和后台失去了一次联系。\n\n书还在原来那个位置，再拖一次就行。",
        { step: 2, stepName: "看清洗结果", detail: String(err) });
    });
  }

  // ---------- ② 处理中 ----------
  //
  // 这一屏不报进度（决定7）：没有百分比、没有阶段名、没有路径。它只回答
  // 一件事 —— 这里在干活，而且不会停。
  //
  // 背景演"这本书正在被怎么样"，两套：
  //   clean（导入 / 复核 / 重跑）：广告行被划掉、碎行被并回一段；
  //   ink  （付梓）：一枚枚字模压到纸上，从虚到实。
  // 前景两套共用：书名 + 一句祈祷文案。
  //
  // 文案（决定9）：越像"正在校对"越糟 —— 一闪而过时读成"刚校对完"，
  // 卡住时又读成"到这一步了"。所以只写与工序无关、明显不承载信息的话。
  // 四类流程各一套，别让人在三次不同的事情上看到同一句。
  var PRAYERS = {
    import: ["正在检字", "墨正在醒", "字在纸上等", "手还没停"],
    build:  ["正在上墨", "正在覆纸", "正在压印", "纸在等墨干"],
    review: ["正在校样", "正在核红", "手还没停"],
    rerun:  ["正在改样", "正在换字", "墨重新醒"]
  };

  var busyKind = "import";
  var busyIdx = 0;
  var busyReturn = "drop";       // 取消之后退回哪一屏：取消 = 这次没发生
  var busyRevealTimer = null;
  var busyRotateTimer = null;
  var busyFadeTimer = null;
  var activeJobId = null;        // 当前这一屏背后真正在跑的任务，取消时要用

  // ---------- ② 处理中：背景 ----------
  //
  // 两套共用一个骨架：量出前景占的那块（bgKeepOut）、在屏上找个不打架的
  // 位置、造一片、演完化掉、再补下一片。区别只在"一片是什么"和"它做什么"。

  // 这一屏飘的字必须是这本书自己的：由后端 api.import_excerpt(path) 在拖入时
  // 只读解码文件头挑出来（真广告行 / 真断行对 / 相邻两行真正文），装进 bgFeed。
  // 不再放写死的样例文字 —— 用户一眼就认得出「那不是我的书」。EPUB 或读不出
  // 内容时 bgFeed 为空，这一屏宁可安静，也不拿假字凑数。
  // 演的是"这本书里有这样的行会被处理"，不是"本次运行删掉了第 7 行"。
  var bgFeed = null;             // { drop: [str], merge: [[str, str]] } 或 null
  var bgFeedSeq = 0;             // 换书时作废旧一次异步回报，别让新屏飘旧书的话

  // 上字模的字只从这本书自己的正文里抽（payload.glyphs，见 api._book_glyphs）。
  // 这里不再放写死的《兰亭集序》兜底：0 章书、纯外文、纯图之类抽不出真字时，
  // 宁可这一屏一枚字模都不印，也不能印一段跟这本书无关的古文 —— 用户一眼
  // 就能认出来那不是自己的书。取不到就返回空串，bgTickInk 会跳过造字。
  function bgGlyphSource() {
    var g = currentPayload && currentPayload.glyphs;
    if (typeof g === "string" && g.length >= 8) { return g; }
    return "";
  }

  var bgMode = "";               // "" / "clean" / "ink"
  var bgStage = null;
  var bgTimers = [];             // 这一轮背景排下的所有定时器，退出时一次清干净
  var bgLive = [];               // 清洗：在场碎片的像素盒
  var bgSlots = [];              // 付梓：位置池
  var bgKeepOut = null;          // 前景占的那块，谁也不许落进去
  var bgQueues = { drop: [], merge: [] };
  var bgGlyphIdx = 0;
  // 屏越大，同时在场的碎片越多 —— 但"疏密"要一样，所以按面积折算。
  var BG_AREA0 = 1013 * 580;

  var bgRand = function (a, b) { return a + Math.random() * (b - a); };

  // 所有延时都走这里，退出时能一次清干净（漏一个，切屏之后还会冒出来）。
  function bgLater(fn, ms) {
    var t = setTimeout(function () {
      var k = bgTimers.indexOf(t);
      if (k >= 0) { bgTimers.splice(k, 1); }
      fn();
    }, ms);
    bgTimers.push(t);
    return t;
  }

  // 后端给的真内容校验成固定形状，免得桥上带回怪东西把动画搞坏。
  // 这里只裁长度、不改写字：飘在屏上的每一个字都还是原文里的。
  function normalizeFeed(res) {
    if (!res || typeof res !== "object") { return null; }
    var out = { drop: [], merge: [] };
    var i, v;
    if (Object.prototype.toString.call(res.drop) === "[object Array]") {
      for (i = 0; i < res.drop.length && out.drop.length < 24; i++) {
        v = res.drop[i];
        if (typeof v === "string" && v) { out.drop.push(v.slice(0, 40)); }
      }
    }
    if (Object.prototype.toString.call(res.merge) === "[object Array]") {
      for (i = 0; i < res.merge.length && out.merge.length < 24; i++) {
        v = res.merge[i];
        if (Object.prototype.toString.call(v) === "[object Array]" &&
            typeof v[0] === "string" && typeof v[1] === "string" && v[0] && v[1]) {
          out.merge.push([v[0].slice(0, 40), v[1].slice(0, 40)]);
        }
      }
    }
    return (out.drop.length || out.merge.length) ? out : null;
  }

  function bgStop() {
    for (var i = 0; i < bgTimers.length; i++) { clearTimeout(bgTimers[i]); }
    bgTimers = [];
    if (bgStage) { bgStage.innerHTML = ""; }
    bgStage = null;
    bgLive = [];
    bgSlots = [];
    bgKeepOut = null;
    bgQueues = { drop: [], merge: [] };
    bgMode = "";
  }

  // 书名 + 文案占的那块（像素），碎纸与字模都不许落进去。
  // 横向让得比纵向开：同一高度上的碎纸贴到书名边上，会被读成书名的注脚。
  // 纵向本来就像纸边上的字，让开一点点就够。
  function bgMeasure() {
    bgKeepOut = null;
    if (!bgStage) { return; }
    var st = bgStage.getBoundingClientRect();
    var t = el("busy-name");
    var l = el("busy-line");
    var tr = t ? t.getBoundingClientRect() : null;
    var lr = l ? l.getBoundingClientRect() : null;
    if (!tr || (!tr.width && !lr)) { return; }
    if (!lr || !lr.width) { lr = tr; }
    var left = Math.min(tr.left, lr.left) - st.left;
    var right = Math.max(tr.right, lr.right) - st.left;
    var top = Math.min(tr.top, lr.top) - st.top;
    var bottom = Math.max(tr.bottom, lr.bottom) - st.top;
    var padX = bgMode === "ink" ? 52 : 96;
    var padY = bgMode === "ink" ? 40 : 58;
    bgKeepOut = { l: left - padX, t: top - padY, r: right + padX, b: bottom + padY };
  }

  function bgStageSize() {
    if (!bgStage) { return { w: 0, h: 0 }; }
    return { w: bgStage.clientWidth, h: bgStage.clientHeight };
  }

  // ---- 清洗：一片碎纸 ----

  function bgNextSample(kind) {
    var src = (bgFeed && bgFeed[kind]) ? bgFeed[kind] : [];
    if (!src.length) { return null; }   // 没有真内容就不造这一片
    var q = bgQueues[kind];
    if (!q.length) {
      // 一轮之内每句只上一次：同屏并排两条一模一样的碎行，一眼就看穿是动画。
      q = src.slice();
      for (var i = q.length - 1; i > 0; i--) {
        var j = (Math.random() * (i + 1)) | 0;
        var t = q[i]; q[i] = q[j]; q[j] = t;
      }
      bgQueues[kind] = q;
    }
    return q.pop();
  }

  function bgTypeInto(node, str) {
    for (var i = 0; i < str.length; i++) {
      var sp = document.createElement("span");
      sp.className = "ch";
      sp.textContent = str.charAt(i);
      sp.style.transitionDelay = Math.round(i * 20) + "ms";
      node.appendChild(sp);
    }
  }

  // 位置：不用固定槽位表 —— 碎片宽度差得远（一条广告 240px，一截碎行 60px），
  // 按格子摆会一边挤一边空。先造出来量到实际尺寸，再找一个放得下、又跟别人
  // 不打架的地方；找不到就一级级把缝收紧，宁可密一点，也不要只剩两片像卡住了。
  var BG_GAPS = [[26, 20], [16, 12], [8, 6], [2, 2]];

  function bgPlaceClean(w, h) {
    var sz = bgStageSize();
    var fw = sz.w, fh = sz.h;
    var mx = 24, my = 22;
    var halfW = w / 2, halfH = h / 2;
    if (fw - 2 * mx < w || fh - 2 * my < h) { return null; }

    for (var g = 0; g < BG_GAPS.length; g++) {
      var gx = BG_GAPS[g][0], gy = BG_GAPS[g][1];
      var best = null, bestNear = -1;
      for (var t = 0; t < 90; t++) {
        var x = bgRand(mx + halfW, fw - mx - halfW);
        var y = bgRand(my + halfH, fh - my - halfH);
        var box = { l: x - halfW, t: y - halfH, r: x + halfW, b: y + halfH };

        // 右下角是「取消」，它必须点得到。
        if (box.r > fw - 170 && box.b > fh - 120) { continue; }
        if (bgKeepOut &&
            !(box.r < bgKeepOut.l || box.l > bgKeepOut.r ||
              box.b < bgKeepOut.t || box.t > bgKeepOut.b)) { continue; }

        var clash = false, near = 1e9;
        for (var i = 0; i < bgLive.length; i++) {
          var o = bgLive[i];
          if (!(box.r < o.l - gx || box.l > o.r + gx ||
                box.b < o.t - gy || box.t > o.b + gy)) { clash = true; break; }
          // 不打架还不够：还要尽量离得远。取"最近的邻居有多远"打分。
          var dx = Math.max(0, Math.max(o.l - box.r, box.l - o.r));
          var dy = Math.max(0, Math.max(o.t - box.b, box.t - o.b));
          var d = Math.sqrt(dx * dx + dy * dy);
          if (d < near) { near = d; }
        }
        if (clash) { continue; }
        if (near > bestNear) { bestNear = near; best = { x: x, y: y, box: box }; }
      }
      if (best) { return best; }     // 这一级已经够松，不必再收紧
    }
    return null;
  }

  // kind: "drop" 划掉 / "merge" 并段
  function bgSpawnClean(kind) {
    var sample = bgNextSample(kind);
    if (!sample) { return false; }   // 这本书没有这类真内容，这一片就不造
    var pc = document.createElement("div");
    var pl = null, mg = null;

    if (kind === "drop") {
      pl = document.createElement("div");
      pl.className = "bg-line";
      bgTypeInto(pl, sample);
      var rk = document.createElement("i");
      rk.className = "bg-rk";
      pl.appendChild(rk);
      pc.appendChild(pl);
    } else {
      mg = document.createElement("div");
      mg.className = "bg-merge";
      var x1 = document.createElement("span");
      x1.className = "bg-ml";
      x1.textContent = sample[0];
      var x2 = document.createElement("span");
      x2.className = "bg-ml";
      x2.textContent = sample[1];
      mg.appendChild(x1);
      mg.appendChild(x2);
      pc.appendChild(mg);
    }
    pc.className = "bg-pc";

    // 先挂到一个不出现在屏上的位置量尺寸（opacity 0 由默认值承担）。
    pc.style.left = "-9999px";
    pc.style.top = "-9999px";
    bgStage.appendChild(pc);

    var spot = bgPlaceClean(pc.offsetWidth, pc.offsetHeight);
    if (!spot) {
      bgStage.removeChild(pc);
      return false;                  // 屏上实在挤不下，这一枚就算了
    }

    pc.style.left = spot.x.toFixed(1) + "px";
    pc.style.top = spot.y.toFixed(1) + "px";
    pc.style.setProperty("--rot", bgRand(-2.6, 2.6).toFixed(2) + "deg");
    // 纸有新旧：有的字清楚，有的只剩一点影。红线不跟着淡 —— 它要一直是真的。
    pc.style.setProperty("--pa", bgRand(0.86, 1).toFixed(2));

    bgLive.push(spot.box);
    pc._box = spot.box;
    pc.classList.add("in");

    var t0;
    if (kind === "drop") {
      pl.classList.add("on");                       // 逐字打出来
      var typeMs = pl.textContent.length * 20 + 260;
      var t1 = typeMs + 300;                        // 打完停一下，再划
      bgLater(function () { pl.classList.add("rule"); }, t1);
      t0 = t1 + 430 + 240;                          // 划完几乎不停，一起化
    } else {
      // 两截各自打出来之后才谈得上"缝"。按行字数算，别写死。
      var tm = Math.max(x1.textContent.length, x2.textContent.length) * 20 + 420;
      bgLater(function () { mg.classList.add("merged"); }, tm);
      t0 = tm + 980 + 700;                          // 缝收拢、看清是一个段，再化
    }

    // 整块（字与红线）一起化掉，不在屏上留痕。
    bgLater(function () {
      pc.classList.remove("in");
      pc.classList.add("out");
      bgLater(function () {
        var k = bgLive.indexOf(pc._box);
        if (k >= 0) { bgLive.splice(k, 1); }
        if (pc.parentNode) { pc.parentNode.removeChild(pc); }
      }, 820);
    }, t0);

    return true;
  }

  // ---- 付梓：一枚字模 ----

  function bgBuildSlots() {
    bgSlots = [];
    var sz = bgStageSize();
    var fw = sz.w, fh = sz.h;
    if (!fw || !fh) { return; }
    // 抖动网格：纯网格读作表格，纯随机读作画糊了，两个点会叠在一起。
    var COLS = 9, ROWS = 5;
    var placed = [];
    var MIN_D = 0.135;
    for (var r = 0; r < ROWS; r++) {
      for (var c = 0; c < COLS; c++) {
        var ok = false, x = 0, y = 0;
        for (var t = 0; t < 60 && !ok; t++) {
          x = 0.06 + ((c + 0.5) / COLS) * 0.88 + bgRand(-0.5, 0.5) * (0.88 / COLS) * 0.82;
          y = 0.09 + ((r + 0.5) / ROWS) * 0.82 + bgRand(-0.5, 0.5) * (0.82 / ROWS) * 0.82;
          if (x < 0.04 || x > 0.96 || y < 0.055 || y > 0.945) { continue; }
          var far = true;
          for (var i = 0; i < placed.length; i++) {
            var ax = x - placed[i][0];
            var ay = (y - placed[i][1]) * 1.5;   // 竖向拉长：窗口矮时不挤
            if (ax * ax + ay * ay < MIN_D * MIN_D) { far = false; break; }
          }
          if (!far) { continue; }
          ok = true;
        }
        if (!ok) { continue; }
        placed.push([x, y]);

        var slot = document.createElement("div");
        slot.className = "bg-slot";
        slot.style.left = (x * 100).toFixed(2) + "%";
        slot.style.top = (y * 100).toFixed(2) + "%";
        var blk = document.createElement("div");
        blk.className = "bg-blk";
        var gl = document.createElement("span");
        gl.className = "bg-glyph";
        blk.appendChild(gl);
        slot.appendChild(blk);
        bgStage.appendChild(slot);
        bgSlots.push({ x: x, y: y, busy: false, blk: blk, gl: gl });
      }
    }
  }

  // 这枚字模的中心能不能落在那儿：右下角是「取消」、中间是书名。
  function bgInkBlocked(x, y) {
    var sz = bgStageSize();
    var px = x * sz.w, py = y * sz.h;
    if (px > sz.w - 150 && py > sz.h - 96) { return true; }
    if (!bgKeepOut) { return false; }
    return px > bgKeepOut.l && px < bgKeepOut.r &&
           py > bgKeepOut.t && py < bgKeepOut.b;
  }

  // 取下一枚该印的字。
  // 字模表本身已经去过重（后端 _book_glyphs 保证 48 个互不相同），但表是会
  // 绕圈的：付梓等待动辄一分钟，每秒添一枚，绕回表头时表头那几个字可能还活
  // 在屏幕上 —— 同一枚字印两遍，看着就像画面卡住了（试用反馈第 3 条）。
  // 所以取字时跳过"此刻正印在屏幕上"的那些，绕一圈也撞不上。
  function bgNextGlyph() {
    var src = bgGlyphSource();
    if (!src) { return ""; }
    var n = src.length;
    var live = {};
    for (var i = 0; i < bgSlots.length; i++) {
      if (bgSlots[i].busy && bgSlots[i].gl) { live[bgSlots[i].gl.textContent] = true; }
    }
    for (var k = 0; k < n; k++) {
      var ch = src.charAt((bgGlyphIdx + k) % n);
      if (!live[ch]) {
        bgGlyphIdx = (bgGlyphIdx + k + 1) % n;
        return ch;
      }
    }
    // 全表恰好在场（字模表比屏幕放得下的还少）：只能按顺序重复了。
    var one = src.charAt(bgGlyphIdx % n);
    bgGlyphIdx = (bgGlyphIdx + 1) % n;
    return one;
  }

  function bgBornInk(slot) {
    var ch = bgNextGlyph();
    if (!ch) { return; }   // 没有真字就不占这个位置，也不排队空字模
    slot.busy = true;
    slot.gl.textContent = ch;
    slot.blk.style.setProperty("--rot", bgRand(-2.4, 2.4).toFixed(1) + "deg");
    // 每一枚自己的呼吸周期：8–14 秒。全都一样就成了心跳。
    slot.blk.style.setProperty("--bt", Math.round(bgRand(8000, 14000)) + "ms");
    slot.blk.classList.remove("out");
    slot.blk.classList.add("in");

    // 活 9–16 秒，少数活到 22 秒（少数活很久，画面才有"底"）。
    var hold = bgRand(9000, 16000);
    if (Math.random() < 0.12) { hold = bgRand(17000, 22000); }

    bgLater(function () {
      slot.blk.classList.remove("in");
      slot.blk.classList.add("out");
      bgLater(function () {
        slot.blk.classList.remove("out");
        slot.busy = false;
      }, 2400);
    }, 2000 + hold);
  }

  // ---- 节奏：一片接一片，疏密由一条很慢的正弦调制 ----
  // 不是"一波一波"：波次会让画面读作机器在按批干活。这里连续不断，
  // 只是有时四五片同时在，有时只剩一片。周期 41 秒 —— 比任何一次等待都长。
  var bgT0 = 0;

  function bgBreath() {
    var ph = ((Date.now() - bgT0) / 41000) * Math.PI * 2 - Math.PI / 2;
    return (Math.sin(ph) + 1) / 2;   // 0 = 最疏，1 = 最密
  }

  function bgTickClean() {
    var b = bgBreath();
    var sz = bgStageSize();
    var area = (sz.w * sz.h) / BG_AREA0;
    var scale = Math.min(1.5, Math.max(0.92, area));
    var target = Math.max(4, Math.round((5 + b * 4) * scale));

    if (bgLive.length < target) {
      // 这本书里有什么真内容就演什么：只有碎行对时别一直空转 drop。
      // 两种都没有（EPUB、读不出内容）就一片都不造，这一屏安静。
      var hasDrop = !!(bgFeed && bgFeed.drop && bgFeed.drop.length);
      var hasMerge = !!(bgFeed && bgFeed.merge && bgFeed.merge.length);
      var kind = (hasDrop && hasMerge) ? (Math.random() < 0.62 ? "drop" : "merge")
               : hasDrop ? "drop" : hasMerge ? "merge" : null;
      if (kind) { bgSpawnClean(kind); }
    }
    bgLater(bgTickClean, 330 + (1 - b) * 460 + Math.random() * 260);
  }

  function bgTickInk() {
    // 这本书抽不出真字：一枚字模都不印，也不拿写死的古文凑数。
    // 仍然接着排队，万一后端稍后把 glyphs 补进来还能接上。
    if (!bgGlyphSource()) {
      bgLater(bgTickInk, 600);
      return;
    }
    var b = bgBreath();
    var live = [], idle = [], i;
    for (i = 0; i < bgSlots.length; i++) {
      (bgSlots[i].busy ? live : idle).push(bgSlots[i]);
    }
    var target = 5 + Math.round(b * 4);   // 疏时 5 枚，密时 9 枚

    if (live.length < target && idle.length) {
      // 在空位里挑"离在场字模足够远"的。
      // ★ 不挑最远的那个 —— 挑最远会把字模全推到四角、中间空一圈，读作"描了个边框"。
      var GOOD = 0.20, ok = [], best = null, bestD = -1;
      for (i = 0; i < idle.length; i++) {
        var sp = idle[i], near = 9;
        for (var m = 0; m < live.length; m++) {
          var dx = sp.x - live[m].x, dy = (sp.y - live[m].y) * 1.5;
          var d = dx * dx + dy * dy;
          if (d < near) { near = d; }
        }
        if (!bgInkBlocked(sp.x, sp.y) && near >= GOOD * GOOD) { ok.push(sp); }
        if (near > bestD) { bestD = near; best = sp; }
      }
      var sel = ok.length ? ok[(Math.random() * ok.length) | 0]
                          : (bgInkBlocked(best.x, best.y) ? null : best);
      if (sel) { bgBornInk(sel); }
    }
    // 补一枚的间隔：密时 480–760ms，疏时 1100–1600ms
    bgLater(bgTickInk, 480 + (1 - b) * 640 + Math.random() * 280);
  }

  // 开工：mode = "clean" 划掉并段 / "ink" 压字模。两套共用同一批可见性规则。
  function bgStart(mode) {
    bgStop();
    bgMode = mode;
    bgStage = el("busy-stage");
    if (!bgStage) { return; }
    bgStage.className = "busy-stage" + (mode === "ink" ? " is-ink" : "");
    bgT0 = Date.now();
    bgMeasure();
    if (mode === "ink") {
      // 每次付梓都从这套字模的第一个字开始印；接着上一轮往下数，
      // 第二本书会从上一本的第七个字起步 —— 看不出问题，但不对。
      bgGlyphIdx = 0;
      bgBuildSlots();
    }
    // 前面留一口气：决定9 —— 快的时候用户根本看不到这一屏。
    bgLater(mode === "ink" ? bgTickInk : bgTickClean, 900);
  }

  // 换一句、改字号、改窗口，书名那块矩形都会变 —— 重新量。
  window.addEventListener("resize", function () { bgMeasure(); });

  // ---------- ② 处理中：进出 ----------

  function busyLeave() {
    if (busyRevealTimer) { clearTimeout(busyRevealTimer); busyRevealTimer = null; }
    if (busyRotateTimer) { clearTimeout(busyRotateTimer); busyRotateTimer = null; }
    if (busyFadeTimer) { clearTimeout(busyFadeTimer); busyFadeTimer = null; }
    bgStop();
    var f = el("busy-fore");
    if (f) { f.classList.remove("on"); }
    var ln = el("busy-line");
    if (ln) { ln.classList.remove("on"); }
    var c = el("btn-cancel");
    if (c) { c.classList.remove("on"); }
  }

  // 前 1.1 秒整屏空白（决定9）：清洗快的时候这一屏根本不该被看见。
  function busyEnter(kind, title, back) {
    busyLeave();
    busyKind = PRAYERS[kind] ? kind : "import";
    busyIdx = 0;
    busyReturn = back || "drop";
    activeJobId = null;
    var nm = el("busy-name");
    nm.textContent = title || "";
    nm.hidden = !title;
    var ln = el("busy-line");
    ln.textContent = "";
    ln.classList.remove("on");
    setView("busy");
    // 付梓是最后一道工序，演压缩字模；其余三种都在动纸上的字。
    bgStart(busyKind === "build" ? "ink" : "clean");
    busyRevealTimer = setTimeout(function () {
      busyRevealTimer = null;
      el("busy-fore").classList.add("on");
      el("btn-cancel").classList.add("on");
      busySay(0);
    }, 1100);
  }

  // 一句话不是"换"上去的，是淡进淡出的：8.4 秒一句，太快就是跑马灯，
  // 人还没读完就换了。
  function busySay(i) {
    var list = PRAYERS[busyKind] || PRAYERS.import;
    busyIdx = i % list.length;
    var ln = el("busy-line");
    ln.textContent = list[busyIdx];
    ln.classList.add("on");
    busyRotateTimer = setTimeout(function () {
      ln.classList.remove("on");
      busyFadeTimer = setTimeout(function () {
        busyFadeTimer = null;
        busySay(busyIdx + 1);
      }, 900);
    }, 8400);
  }


  // 文件名去掉目录、去掉扩展名 —— 路径不是必要信息（决定8），
  // 用户刚给过；他认得的是书名。
  function metaTitle() {
    var m = currentPayload && currentPayload.meta;
    return (m && m.title) || "";
  }

  function bookNameOf(path) {
    var s = String(path || "");
    var i = Math.max(s.lastIndexOf("/"), s.lastIndexOf(String.fromCharCode(92)));
    if (i >= 0) { s = s.slice(i + 1); }
    return s.replace(/\.[^.]+$/, "");
  }

  function startImport(path) {
    if (!path) { return; }
    // 新的一本书：忘掉上一次「用户动过字体勾」，默认值按这本来书重算。
    // 重置会话不用单独清 —— 回首页之后要再进 ④ 页只能靠下一次 startImport。
    fontsTouched = false;
    var a = api();
    if (!a) {
      // 桥还没注入完：先记下来，等 pywebviewready 再发。丢文件比报错更让人困惑。
      pendingPath = path;
      return;
    }
    stopPolling();
    // 等待页要飘这本书自己的话：拖入的同时只读取几行真内容（不耽误清洗）。
    // 后端没有这个方法、或读不出内容时，这一屏宁可安静也不飘假样例。
    var seq = ++bgFeedSeq;
    bgFeed = null;
    busyEnter("import", bookNameOf(path), "drop");
    Promise.resolve(a.import_excerpt ? a.import_excerpt(path) : null)
      .then(function (feed) {
        if (seq !== bgFeedSeq) { return; }   // 又拖了别的书：别让新屏飘旧书的话
        bgFeed = normalizeFeed(feed);
        bgQueues = { drop: [], merge: [] };  // 换了内容源，重新洗牌
      })
      .catch(function () { /* 取不到就安静，不必打扰用户 */ });
    a.import_file(path).then(function (res) {
      if (!res || !res.job_id) {
        showError("没能开始", (res && res.error) || "后端没有给出任务号。",
          { step: 2, stepName: "看清洗结果" });
        return;
      }
      currentJob = res.job_id;
      activeJobId = res.job_id;
      poll(currentJob);
    }).catch(function (err) {
      showError("没能开始", "这本书没能交到清洗那一步。\n\n换个文件再试一次。",
        { step: 2, stepName: "看清洗结果", detail: String(err) });
    });
  }

  // 错误页「仍然继续」：只在后端把这次失败标成"默认拒收、但用户可以硬来"时才出现
  // （目前只有整本糊行）。后端 force_import 拿这个 jobId 找回同一个 Session、挂上旗子
  // 再洗一遍；界面这边照正常导入重新走忙碌屏和轮询，不特殊对待 —— 出口是口子，不是另一条流程。
  function forceImport(jobId) {
    if (!jobId) { return; }
    var a = api();
    if (!a) {
      showError("界面没有连上后端", "pywebview 的桥没有注入成功。请重启程序。",
        { step: 2, stepName: "看清洗结果" });
      return;
    }
    stopPolling();
    // 还是同一本书：沿用上次拖入时取到的真内容，不重新读文件（force 走的是
    // 同一个 Session）。忙碌屏的书名还留在 busy-name 里，也直接沿用。
    ++bgFeedSeq;
    busyEnter("import", el("busy-name").textContent, "drop");
    a.force_import(jobId).then(function (res) {
      if (!res || !res.job_id) {
        showError("没能继续", (res && res.error) || "后端没有给出任务号。",
          { step: 2, stepName: "看清洗结果" });
        return;
      }
      currentJob = res.job_id;
      activeJobId = res.job_id;
      poll(currentJob);
    }).catch(function (err) {
      showError("没能继续", "这本书没能再洗一遍。\n\n换个文件再试一次。",
        { step: 2, stepName: "看清洗结果", detail: String(err) });
    });
  }

  // ---------- ② 结果页渲染 ----------

  // 一个数 + 它下面那个小标签。三个数并排就是一页账。
  function rfig(value, unit) {
    var wrap = document.createElement("div");
    wrap.className = "r-fig";
    var b = document.createElement("b");
    b.textContent = num(value);
    var s = document.createElement("span");
    s.textContent = unit;
    wrap.appendChild(b); wrap.appendChild(s);
    return wrap;
  }

  // 书名 = 文件名去掉扩展名。"山河故人.txt" 里的 .txt 对用户没有信息量
  // （决定35：扩展名对用户无意义）。
  function titleOf(payload) {
    var n = String((payload && (payload.name || payload.file)) || "");
    var cut = n.lastIndexOf(".");
    if (cut > 0) { n = n.slice(0, cut); }
    return n;
  }

  function render(payload) {
    currentPayload = payload;
    if (!payload) { showError("没有拿到结果", "后端返回了空的结果。", { step: 2, stepName: "看清洗结果" }); return; }

    var isEpub = payload.kind === "epub";
    var stats = payload.stats || {};
    var dropped = payload.dropped || {};
    var fixed = payload.fixed || {};
    var merged = payload.merged || {};
    var lines = payload.lines || {};
    var imp = payload.import || {};

    text(el("r-title"), titleOf(payload));
    el("r-title").title = payload.file || "";

    // 先说"这本书打开有没有东西读"，再给账单：0 字 0 章的版面跟成功一模一样，
    // 是 docs/gui-design.md 的「验收」一节第 5 条实测六种异常路径后剩下的唯一文案缺口。
    // 状态由后端算（_content_state），前端只配句子 —— 别在这儿再判一次字数。
    var state = payload.content_state || "text";
    var emptyBox = el("r-empty");
    if (state === "empty") {
      emptyBox.classList.remove("calm");
      text(emptyBox, "一个字都没剩下 —— 整页都是目录、广告或空行。" +
        "这样打包是一本空白书，先看原文件。");
      emptyBox.hidden = false;
    } else if (state === "images_only") {
      text(emptyBox, "只有 " + num(imp.images_kept) +
        " 张插图。照样能打包，成品里全是图。");
      emptyBox.classList.add("calm");
      emptyBox.hidden = false;
    } else {
      emptyBox.hidden = true;
    }

    // 三个数，就三个（决定12）。选这三个是因为它们各自能改变一个决定：
    // 章节数一眼能判"切章切对没有"（7000 章还是 3 章）；删行与合并直接决定
    // 要不要去复核。字数、编码、文件大小、行数、段落数、平均每章字数全撤 ——
    // 字数没有分母可对照，"改写"那类量级再大也不改变"这本书还能不能读"。
    // 删除量的绝对值本身就是信号，不需要分母。
    var figs = el("r-figures");
    figs.innerHTML = "";
    if (isEpub) {
      figs.appendChild(rfig(stats.chapters || 0, "章"));
      figs.appendChild(rfig(imp.images_kept || 0, "图"));
      if (imp.volumes) { figs.appendChild(rfig(imp.volumes, "卷")); }
    } else {
      figs.appendChild(rfig(stats.chapters || 0, "章"));
      figs.appendChild(rfig((dropped.ad || 0) + (dropped.toc || 0), "删行"));
      figs.appendChild(rfig(merged.groups || 0, "合并"));
    }

    // 重跑回来时交代一句"你刚才勾的生效了没有"。
    // 原来的脚注还带产物路径，那条删了（决定15）；留下/断开是用户自己动过手的
    // 结果，得给他回执，否则重跑完数字一变，他不知道变的是不是他勾的那些。
    var adj = payload.adjust || {};
    var prot = adj.protected || {};
    var notes = [];
    if (prot.lines) { notes.push("留下 " + num(prot.lines) + " 行该删的"); }
    if (adj.merge_breaks_hit) { notes.push("断开 " + num(adj.merge_breaks_hit) + " 处合并"); }
    var noteBox = el("r-note");
    if (notes.length) { text(noteBox, notes.join(" · ")); noteBox.hidden = false; }
    else { noteBox.hidden = true; }



    // 告警最多三行（决定31）。合并、计数、排序全在后端做完了
    // （gui/api.py 的 _alerts），前端只负责画 —— 级别不该由界面猜。
    var alerts = payload.alerts || [];
    var warnBox = el("r-warnings");
    var warnList = el("r-warn-list");
    warnList.innerHTML = "";
    if (alerts.length) {
      alerts.forEach(function (a) {
        var li = document.createElement("li");
        li.textContent = a.text;
        warnList.appendChild(li);
      });
      warnBox.hidden = false;
    } else {
      warnBox.hidden = true;
    }

    // ③ 复核只对 TXT 有意义：它画的是 dropped_lines / 碎行合并，导入的书没有这些。
    // 禁掉而不是隐藏 —— 按钮位置跳来跳去比灰着更让人困惑。
    el("btn-review").disabled = isEpub;
    el("btn-review").title = isEpub
      ? "导入的书没有可复核的删除/合并（它没经过清洗）"
      : "看看这次删了什么、合并了什么";
    el("btn-epub").disabled = false;
    el("btn-epub").title = "下一步：确认书名与作者";

    // ★ 复核按钮的名单在这里复位：render 只被「清洗完成」调用一次，
    //   旧书留下的「已看过」不能带到新书上。
    rv.seen = {};

    setView("result");
  }

  // ---------- ④ 元数据页渲染 ----------

  // ---------- ③ 复核（校定） ----------
  //
  // 五类事实：删除 / 合并 / 切章 / 章节树 / 缺字。前两类能勾（别删 / 别并），
  // 后三类只能看 —— 它们要么是清洗的结论，要么是字库的事实，界面里摆一个
  // 假开关是骗人。
  //
  // 数据分两次要：进页面时每类只拿前 40 行（后端已压成 60 字摘要），滚到底
  // 再要下一段；点开某一行才要那一行的上下文（决定24/25/27）。
  // 「正文不进界面」那条铁律只管 ② 结果页 —— 这里是复核页，不给原文就没法复核。

  var rv = {
    job: "", name: "", groups: [], byKey: {}, key: "",
    sel: -1, detail: {}, seen: {}, picked: {}, base: {}, loading: false
  };

  function rvPickKey(key, row) {
    return key === "merge" ? "merge:" + row.cut : key + ":" + row.ln;
  }

  // 后端行里的 kept / brk 就是"当前已经是别删 / 已断开"。进页面先把它落进
  // 勾选态，同时记一份 base —— 判断"用户改过没有"要跟 base 比，不能跟"空"
  // 比：重跑一次之后所有勾都还在，那时没动过也不该再跑一遍。
  function rvSeed(g) {
    g.rows.forEach(function (r) {
      var on = g.key === "merge" ? r.brk : r.kept;
      if (!on) { return; }
      var k = rvPickKey(g.key, r);
      rv.picked[k] = true;
      rv.base[k] = true;
    });
  }

  function rvDirty() {
    return Object.keys(rv.picked).sort().join(",") !== Object.keys(rv.base).sort().join(",");
  }

  function rvAdjust() {
    var protect = [], breaks = [];
    Object.keys(rv.picked).forEach(function (k) {
      if (!rv.picked[k]) { return; }
      var parts = k.split(":");
      var n = parseInt(parts[1], 10);
      if (!n) { return; }
      if (parts[0] === "merge") { breaks.push(n); } else { protect.push(n); }
    });
    protect.sort(function (a, b) { return a - b; });
    breaks.sort(function (a, b) { return a - b; });
    var out = {};
    if (protect.length) { out.protect_lines = protect; }
    if (breaks.length) { out.merge_breaks = breaks; }
    return out;
  }

  function rvGroup() { return rv.byKey[rv.key] || null; }

  function rvAllSeen() {
    if (!rv.groups.length) { return false; }
    for (var i = 0; i < rv.groups.length; i++) {
      if (!rv.seen[rv.groups[i].key]) { return false; }
    }
    return true;
  }

  // 五盏灯全绿时按钮转绿底。绿不是闸（决定21）——它只说明"五类都过了眼"。
  function rvSyncGo() {
    var go = el("btn-accept");
    if (!go || go.classList.contains("go")) { return; }
    go.classList.toggle("ready", rvAllSeen());
  }

  function rvDrawDir() {
    var host = el("b-dir");
    host.innerHTML = "";
    rv.groups.forEach(function (g) {
      var b = document.createElement("button");
      b.type = "button";
      b.dataset.k = g.key;
      if (g.key === rv.key) { b.className = "on"; }
      var dot = document.createElement("span");
      dot.className = "sk-seen" + (rv.seen[g.key] ? " on" : "");
      var nm = document.createElement("span");
      nm.className = "nm";
      nm.textContent = g.name;
      var nu = document.createElement("span");
      nu.className = "num";
      nu.textContent = num(g.num);
      b.appendChild(dot);
      b.appendChild(nm);
      b.appendChild(nu);
      host.appendChild(b);
    });
  }

  function rvDrawHead() {
    var g = rvGroup(), host = el("b-head");
    host.innerHTML = "";
    if (!g) { return; }
    var box = document.createElement("div");
    box.className = "sk-head rise";
    var nm = document.createElement("span");
    nm.className = "nm";
    nm.textContent = g.name;
    var nu = document.createElement("span");
    nu.className = "num";
    nu.textContent = num(g.num);
    var un = document.createElement("span");
    un.className = "unit";
    un.textContent = g.unit;
    box.appendChild(nm);
    box.appendChild(nu);
    box.appendChild(un);
    host.appendChild(box);
  }

  function rvDrawBar() {
    var g = rvGroup(), host = el("b-bar");
    host.innerHTML = "";
    if (!g) { return; }
    var lead = document.createElement("span");
    lead.textContent = "共 " + num(g.num) + " " + g.unit + " · " + g.hint;
    host.appendChild(lead);
    if (!g.act || !g.rows.length) { return; }
    var sp = document.createElement("span");
    sp.className = "spacer";
    host.appendChild(sp);
    var all = document.createElement("button");
    all.type = "button";
    all.className = "sk-act";
    all.textContent = "全选";
    all.addEventListener("click", function () { rvSetAll(true); });
    var none = document.createElement("button");
    none.type = "button";
    none.className = "sk-act";
    none.textContent = "全不选";
    none.addEventListener("click", function () { rvSetAll(false); });
    host.appendChild(all);
    host.appendChild(none);
  }

  // 这一类**全部**候选的行号。后端的 keys 是全量的（不只已经加载的 40 行），
  // 没有 keys（旧 payload）才退回按已加载的行拼 —— 那样又变成假全选。
  function rvAllKeys(g) {
    if (g.keys && g.keys.length) { return g.keys; }
    return g.rows.map(function (r) { return g.key === "merge" ? r.cut : r.ln; });
  }

  function rvSetAll(on) {
    var g = rvGroup();
    if (!g || !g.act) { return; }
    // 只认后端给的全量行号：以前这里遍历 g.rows，用户得先一直往下滚、
    // 把每页都拉出来才可能真的全选上。
    rvAllKeys(g).forEach(function (n) {
      var k = g.key + ":" + n;
      if (on) { rv.picked[k] = true; } else { delete rv.picked[k]; }
    });
    rvDrawList();
    rvSyncGo();
  }

  function rvRowEl(g, r, i) {
    var li = document.createElement("li");
    li.className = "sk-row" + (i === rv.sel ? " sel" : "");
    li.dataset.i = i;
    var ln = document.createElement("span");
    ln.className = "ln";
    ln.textContent = r.ln2 ? (r.ln + "–" + r.ln2)
      : (r.ln === "" || r.ln === null || r.ln === undefined ? "" : String(r.ln));
    li.appendChild(ln);
    var tx = document.createElement("span");
    tx.className = "tx";
    tx.textContent = r.tx || "";
    li.appendChild(tx);
    if (r.tag) {
      var tag = document.createElement("span");
      tag.className = "tag";
      tag.textContent = r.tag;
      li.appendChild(tag);
    }
    if (g.act) {
      var k = rvPickKey(g.key, r);
      var lab = document.createElement("label");
      lab.className = "keep";
      var inp = document.createElement("input");
      inp.type = "checkbox";
      inp.checked = !!rv.picked[k];
      if (inp.checked) { li.classList.add("kept"); }
      inp.addEventListener("click", function (ev) { ev.stopPropagation(); });
      inp.addEventListener("change", function () {
        if (inp.checked) { rv.picked[k] = true; } else { delete rv.picked[k]; }
        li.classList.toggle("kept", inp.checked);
        rvSyncGo();
      });
      lab.appendChild(inp);
      lab.appendChild(document.createTextNode(g.key === "merge" ? "别并" : "别删"));
      li.appendChild(lab);
    }
    return li;
  }

  // 左右对照。左原文，右改完的样子；只读类的右栏标题换成「怎么了」。
  function rvCmpEl(d) {
    var wrap = document.createElement("div");
    wrap.className = "cmp" + (d.ro ? " ro" : "");
    var left = document.createElement("div");
    left.className = "cmp-col";
    var lc = document.createElement("div");
    lc.className = "cmp-cap";
    lc.textContent = d.lcap || "原文";
    var lb = document.createElement("div");
    lb.className = "cmp-body";
    (d.left || []).forEach(function (it) {
      var p = document.createElement("p");
      if (it.cls) { p.className = it.cls; }
      if (it.ln !== undefined && it.ln !== null && it.ln !== "") {
        var gl = document.createElement("span");
        gl.className = "gl";
        gl.textContent = it.ln;
        p.appendChild(gl);
      }
      p.appendChild(document.createTextNode(it.t || ""));
      lb.appendChild(p);
    });
    left.appendChild(lc);
    left.appendChild(lb);
    wrap.appendChild(left);

    var right = document.createElement("div");
    right.className = "cmp-col";
    var rc = document.createElement("div");
    rc.className = "cmp-cap";
    rc.textContent = d.rcap || "删除后";
    var rb = document.createElement("div");
    rb.className = "cmp-body";
    if (d.prose) {
      var pp = document.createElement("p");
      pp.className = "cmp-prose";
      pp.textContent = d.prose;
      rb.appendChild(pp);
    } else {
      (d.right || []).forEach(function (it) {
        var p = document.createElement("p");
        p.textContent = it.t || "";
        rb.appendChild(p);
      });
    }
    right.appendChild(rc);
    right.appendChild(rb);
    wrap.appendChild(right);
    return wrap;
  }

  function rvInlineEl(g, i) {
    var li = document.createElement("li");
    li.className = "b-inline";
    var d = rv.detail[g.key + ":" + i];
    // 后端理论上不会给空对象，但"给了一份没有内容的对照"比"还在取"更让人困惑，
    // 所以空壳一律按未到处理。
    if (!d || d.pending || (!d.left && !d.right && !d.prose)) {
      var w = document.createElement("div");
      w.className = "cmp-wait";
      w.textContent = "正在取原文…";
      li.appendChild(w);
      return li;
    }
    if (d.error) {
      var e = document.createElement("div");
      e.className = "cmp-wait";
      e.textContent = d.error;
      li.appendChild(e);
      return li;
    }
    li.appendChild(rvCmpEl(d));
    return li;
  }

  function rvDrawList() {
    var g = rvGroup(), host = el("b-list");
    host.innerHTML = "";
    if (!g) { return; }
    if (!g.rows.length) {
      // 缺字这一类没有逐条清单（粒度按简版走：只报个数），给一句话。
      if (g.note) {
        var li0 = document.createElement("li");
        li0.className = "rv-note";
        li0.textContent = g.note;
        host.appendChild(li0);
      }
      return;
    }
    g.rows.forEach(function (r, i) {
      host.appendChild(rvRowEl(g, r, i));
      if (i === rv.sel) { host.appendChild(rvInlineEl(g, i)); }
    });
  }

  // 展开块滚进视野：优先让选中行露出来，其次尽量把对照块也露出来。
  function rvReveal() {
    var wrap = document.querySelector("#view-review .b-listwrap");
    var row = document.querySelector("#b-list .sk-row.sel");
    var block = document.querySelector("#b-list .b-inline");
    if (!wrap || !row) { return; }
    var wr = wrap.getBoundingClientRect(), rr = row.getBoundingClientRect();
    var bh = block ? block.getBoundingClientRect().height : 0;
    var top = 0;
    if (block && rr.height + bh + 8 <= wr.height) {
      var rb = block.getBoundingClientRect();
      var need = rb.bottom - wr.bottom + 6;
      top = need > 0 ? wrap.scrollTop + need : wrap.scrollTop;
    } else {
      top = wrap.scrollTop + (rr.top - wr.top) - 2;
    }
    wrap.scrollTop = Math.max(0, Math.min(top, wrap.scrollHeight - wrap.clientHeight));
  }

  function rvEnsureDetail(key, i) {
    var ck = key + ":" + i;
    if (rv.detail[ck]) { return; }
    rv.detail[ck] = { pending: true };
    var a = api();
    if (!a) { return; }
    Promise.resolve(a.review_detail(rv.job, key, i)).then(function (d) {
      rv.detail[ck] = d || {};
      if (rv.key === key && rv.sel === i) { rvDrawList(); rvReveal(); }
    }).catch(function (err) {
      rv.detail[ck] = { error: String(err) };
      if (rv.key === key && rv.sel === i) { rvDrawList(); }
    });
  }

  function rvDraw() {
    rv.seen[rv.key] = true;
    rvDrawDir();
    rvDrawHead();
    rvDrawBar();
    rvDrawList();
    rvReveal();
    rvSyncGo();
  }

  // 滚到底再要下一段（决定27）。40 行一页，翻到边界时才发请求。
  function rvOnScroll() {
    var w = document.querySelector("#view-review .b-listwrap");
    if (!w || rv.loading) { return; }
    if (w.scrollTop + w.clientHeight < w.scrollHeight - 48) { return; }
    rvMore();
  }

  function rvMore() {
    var g = rvGroup();
    if (!g || !g.more || rv.loading) { return; }
    var a = api();
    if (!a) { return; }
    rv.loading = true;
    Promise.resolve(a.review_more(rv.job, g.key, g.rows.length, 40)).then(function (res) {
      rv.loading = false;
      if (!res || res.error) { return; }
      (res.rows || []).forEach(function (r) { g.rows.push(r); });
      g.more = !!res.more;
      rvSeed(g);
      if (rv.key === g.key) { rvDrawList(); rvDrawBar(); }
    }).catch(function () { rv.loading = false; });
  }

  function rvSelect(key) {
    if (key === rv.key) { return; }
    rv.key = key;
    rv.sel = -1;
    var g = rvGroup();
    if (g && g.act && g.rows.length) { rv.sel = 0; }
    var w = document.querySelector("#view-review .b-listwrap");
    if (w) { w.scrollTop = 0; }
    rvDraw();
    if (rv.sel >= 0) { rvEnsureDetail(rv.key, rv.sel); }
  }

  function rvToggleRow(i) {
    rv.sel = (rv.sel === i ? -1 : i);
    rvDrawList();
    if (rv.sel >= 0) { rvEnsureDetail(rv.key, rv.sel); }
    rvReveal();
  }

  function renderReview(res) {
    rv.job = currentJob || "";
    rv.name = res.name || "";
    rv.groups = res.groups || [];
    rv.byKey = {};
    rv.detail = {};
    rv.seen = {};
    rv.picked = {};
    rv.base = {};
    rv.loading = false;
    rv.groups.forEach(function (g) {
      rv.byKey[g.key] = g;
      rvSeed(g);
    });
    // 默认打开第一类有内容的；整本干净（五类都是 0）就打开第一类。
    var first = null;
    for (var i = 0; i < rv.groups.length; i++) {
      if (rv.groups[i].num > 0) { first = rv.groups[i]; break; }
    }
    if (!first) { first = rv.groups[0] || null; }
    rv.key = first ? first.key : "";
    rv.sel = -1;
    var g = rvGroup();
    if (g && g.act && g.rows.length) { rv.sel = 0; }
    var go = el("btn-accept");
    go.classList.remove("go");
    go.classList.remove("ready");
    setView("review");
    rvDraw();
    if (rv.sel >= 0) { rvEnsureDetail(rv.key, rv.sel); }
  }

  function renderMeta(payload) {
    var meta = payload.meta || {};
    el("m-title").value = meta.title || "";
    el("m-author").value = meta.author || "";
    el("m-lang").value = meta.language || "zh-CN";

    // 这一页的主语是书名和封面，不是统计表。字数是 ② 页那个最大的数字，
    // 已经看过一遍了；这里只留两个"会不会包错书"的凭据：章级结构对不对、
    // 原文是什么编码。不带"这次要打包的是"这种起句 —— 一行字据不需要主谓宾。
    var stats = payload.stats || {};
    var facts = [];
    facts.push(num(stats.chapters || 0) + " 章");
    facts.push(num(stats.paragraphs || 0) + " 段");
    // 编码只对 TXT 有意义：EPUB 里每个 XHTML 自带编码声明，不存在"猜"这回事，
    // 显示"原始编码 utf-8"会让人以为我们做了一次探测（其实没做）。
    if (payload.kind === "epub") {
      facts.push("来自 EPUB " + ((payload.import || {}).epub_version || ""));
    } else {
      facts.push("编码 " + ((payload.encoding || {}).chosen || "—"));
    }
    text(el("m-facts"), facts.join(" · "));

    // 输出目录预填成这次会话的产物目录 —— 用户可以改，也可以点「选目录」。
    // 它收在「更多选项」里，所以 summary 那一行必须带着当前值（syncMoreNote），
    // 否则"收起来"就变成了"藏起来"。
    el("m-outdir").value = payload.outdir || "";
    syncMoreNote();

    // 封面：默认直接出一张自动封面（不是空着）。
    // 理由：这个界面的目的是做出一本能读的书，空白封面 + 「阅读器会显示书名」
    // 是个更差的开局 —— 用户还得先点一下才知道封面长什么样。默认给一张，
    // 不满意再点「换一个」或「不要封面」，比"什么都没选"少一步。
    // 原书自带封面（EPUB 导入那条路）优先：那本来就是这本书的封面，
    // 丢掉它才需要理由（试用反馈：「输入 EPUB 时该自动用原始封面」）。
    coverState.mode = "none";
    coverState.look = null;
    coverState.lookKey = "";
    coverState.seen = [];
    var hasSource = !!(meta.has_source_cover);
    el("btn-cover-source").hidden = !hasSource;
    if (hasSource) {
      requestSourceCover();
    } else {
      requestCoverPreview();
    }
    markCoverButtons();
    // 字体默认：只有原书真的带字体（EPUB 导入时 meta.source_fonts 是数字且 > 0）
    // 才勾。TXT 那条路没有这个键，按老规矩仍默认勾上；打包照读复选框。
    // 只在用户没动过这个勾时才写默认值 —— 他改过就听他的：重进 ④ 页、
    // 校定、重跑都会再走一遍这里，不能把他的选择冲回默认。
    if (!fontsTouched) {
      var sf = meta.source_fonts;
      el("m-fonts").checked = (sf === undefined || sf === null)
        ? true : (typeof sf === "number" && sf > 0);
    }
    // AZW3 默认不勾：多一道转换就多一份等待，用户没要就不做。
    el("m-azw3").checked = false;

    setView("meta");
    // 量字号必须在视图显示之后：display:none 里 clientWidth 是 0，量什么都是 0。
    fitTitle();
  }

  // ---------- ④ 封面 ----------

  // 封面状态。2026-10-28 按试用反馈重做：
  // 原来分"程序化版式"和"用一张画"两条互斥的路，还要用户先理解这个区别。
  // 这个判断是对的 —— 对使用者来说都是"这本书能长的样子"，分路是我们的实现细节，
  // 不该漏到界面上。
  // 现在只有一个队列（后端 cover.all_looks），界面只留四个动作：
  // 自动生成 / 换一个 / 打开图片 / 不要封面；EPUB 自带封面时多一个「用原书封面」。
  //
  // `seen` 记这次会话里给过哪些，让「换一个」优先给没见过的；
  // 全都看过了后端按队列顺序接着转，不会卡在原地。
  var coverState = { mode: "none", look: null, lookKey: "", seen: [] };

  // 版式名压在画面下沿（贴着画，不另起一行自报家门）。右下角那个「3 / 45」
  // 按试用反馈删了：知道一共有 45 种只会让人想去数还剩几种，对选封面没帮助。
  function coverCap(name) {
    var cap = el("cover-cap");
    if (!cap) { return; }
    el("cover-cap-name").textContent = name || "";
    cap.hidden = !name;
  }

  // 临时提示条：只说坏消息（画不出来、读不出原书封面）。好消息不占地方。
  function coverNote(msg) {
    var n = el("cover-note");
    if (!n) { return; }
    n.textContent = msg || "";
    n.hidden = !msg;
  }

  // 「更多选项」收起时，summary 上要能看出成品会落在哪个目录。
  // 整条路径塞进来会把"更多选项"四个字挤掉，所以只留尾部；
  // 完整路径放在 title 里，鼠标停一下能看到。
  function shortDir(dir) {
    if (!dir) { return ""; }
    if (dir.length <= 42) { return dir; }
    // 按分隔符取最后两段：按字符数硬切会切在单词中间（"…\b\backups"）。
    var parts = dir.split(/[\\/]+/).filter(Boolean);
    if (parts.length <= 2) { return dir; }
    return "…\\" + parts.slice(-2).join("\\");
  }

  function syncMoreNote() {
    var note = el("more-note");
    if (!note) { return; }
    var dir = el("m-outdir").value.trim();
    note.textContent = dir ? "输出到 " + shortDir(dir) : "";
    note.title = dir || "";
  }

  function showCoverImage(dataUrl) {
    var frame = el("cover-frame");
    frame.innerHTML = "";
    var img = document.createElement("img");
    img.src = dataUrl;
    img.alt = "封面预览";
    frame.appendChild(img);
  }

  function showCoverEmpty() {
    var frame = el("cover-frame");
    frame.innerHTML = "";
    var d = document.createElement("div");
    d.className = "empty";
    d.textContent = "无封面\n阅读器会显示书名";
    frame.appendChild(d);
  }

  // ④ 页书名改了就重新出一次预览：封面上的字必须跟着改。
  // 书名只有一个 input，而 input 不换行：长一点的书名在窄窗口会被活活切掉
  // （实测 720×520：14 个字 → scrollWidth 424，可宽度只有 352）。
  // 这里不用省略号 —— 书名决定成品文件名，切掉了等于让人看不见自己要做出一本什么书。
  // 按档降字号：36 是主角的号，24 是还读得清的底线，再长也只能横着滚（有光标可拖）。
  var TITLE_SIZES = [36, 33, 30, 27, 24];
  function fitTitle() {
    var t = el("m-title");
    if (!t) { return; }
    t.style.fontSize = "";
    for (var i = 1; i < TITLE_SIZES.length; i++) {
      if (t.scrollWidth <= t.clientWidth + 1) { break; }
      t.style.fontSize = TITLE_SIZES[i] + "px";
    }
  }

  // 用 400ms 防抖 —— 每敲一个字就画一张 1200×1600 太浪费。
  var titlePreviewTimer = null;
  function scheduleCoverPreview() {
    if (coverState.mode !== "auto" && coverState.mode !== "source") return;
    if (titlePreviewTimer) clearTimeout(titlePreviewTimer);
    titlePreviewTimer = setTimeout(function () {
      titlePreviewTimer = null;
      if (coverState.mode === "auto") requestCoverPreview(false);
      else if (coverState.mode === "source") requestSourceCover();
    }, 400);
  }
  // 书名要先按长度降字号（大字在窄格里会溢出），再重画封面。
  function onTitleChanged() {
    fitTitle();
    scheduleCoverPreview();
  }
  // 作者只进封面，不影响字号。
  function onAuthorChanged() {
    scheduleCoverPreview();
  }

  // step=true 是"换一个"，false 是"在当前这张上重画"（改书名/作者触发）。
  // 两种都要把屏幕上当前那张一起发给后端：不带的话后端只认队列第一项，
  // 用户换了几个封面再改书名，画面就跳回第一张（试用反馈第 1 条）。
  function requestCoverPreview(step) {
    var a = api();
    var opts = {
      title: el("m-title").value.trim(),
      author: el("m-author").value.trim()
    };
    if (coverState.look) { opts.look = coverState.look; }
    if (step) {
      opts.step = true;
      opts.current = coverState.lookKey || "";
      opts.seen = coverState.seen;
    }
    var sent = opts;
    a.preview_cover(currentJob, opts).then(function (res) {
      if (!res || res.error) {
        showCoverEmpty();
        coverCap("");
        coverNote((res && res.error) || "封面没画出来");
        return;
      }
      coverState.mode = "auto";
      // 后端没回 look 时留着发出去那份，别把状态清空 —— 下一次重画还要用它。
      coverState.look = res.look || sent.look || null;
      coverState.lookKey = res.look_key || "";
      if (coverState.lookKey && coverState.seen.indexOf(coverState.lookKey) < 0) {
        coverState.seen.push(coverState.lookKey);
      }
      if (res.data_url) { showCoverImage(res.data_url); }
      coverCap(res.look_name || "");
      coverNote("");
      markCoverButtons();
    }).catch(function (err) {
      coverNote("封面预览没刷新出来：" + String(err || ""));
    });
  }

  function requestSourceCover() {
    var a = api();
    a.preview_cover(currentJob, { source: true }).then(function (res) {
      if (!res || res.error) {
        showCoverEmpty();
        coverCap("");
        coverNote("原书封面读不出来");
        return;
      }
      coverState.mode = "source";
      coverState.look = null;
      coverState.lookKey = "";
      if (res.data_url) { showCoverImage(res.data_url); }
      coverCap("原书封面");
      coverNote("");
      markCoverButtons();
    });
  }

  function markCoverButtons() {
    // 已经有自动封面时，这颗按钮的下一个动作是「换一个」——
    // 文案跟着变，省得人去猜「再点一次会给我一张一样的吗」。
    el("btn-cover-auto").textContent =
      (coverState.mode === "auto" && coverState.lookKey) ? "换一个" : "自动生成";
    el("btn-cover-auto").classList.toggle("on", coverState.mode === "auto");
    el("btn-cover-pick").classList.toggle("on", coverState.mode === "image");
    el("btn-cover-none").classList.toggle("on", coverState.mode === "none");
    var src = el("btn-cover-source");
    if (src) src.classList.toggle("on", coverState.mode === "source");
  }

  // ---------- ⑤ 完成页渲染 ----------

  function renderDone(payload) {
    // ★ 这一行是这一页所有按钮的命根子：「打开这本书」要 payload.epub、
    //   「打开所在目录」要 payload.epub || payload.outdir。早先漏了这一行，
    //   currentPayload 一直是 ② 结果页那份（上面没有 epub 键），于是
    //   「打开这本书」静默 return、「打开所在目录」打开的是清洗产物目录 ——
    //   后端辛苦算的 epub/stem/cover 全白给，用户却以为程序没做出书。
    currentPayload = payload;
    if (!payload) { showError("没有拿到打包结果", "后端返回了空的结果。", { step: 5, stepName: "完成" }); return; }

    // 书名当大标题，不带扩展名（决定35）：`.epub` 对读者零信息，
    // 而"这本书叫什么"才是他等了十分钟想确认的东西。
    // 后端特意分开给了 stem，这里不自己拿 name 去切 —— 书名里本来就可能有点。
    text(el("d-title"), payload.stem || payload.title || "未命名");

    text(el("d-author"), payload.author || "未署名");

    // 篇幅只说章数。段数在 ③ 页已经删过一次（决定12），跑到最后一页又
    // 冒出来是同一件事说两遍；字数同理。章数是这本书的骨架，一页说得完。
    var len = payload.chapters ? (num(payload.chapters) + " 章") : "";
    text(el("d-length"), len || "—");

    // AZW3：要了才显示。成功说清给了个什么，失败说清"EPUB 已经好了"。
    var row = el("d-azw3-row");
    var extra = el("d-azw3");
    if (payload.azw3) {
      row.hidden = false;
      if (payload.azw3.error) {
        extra.className = "muted";
        // 失败只报"为什么 + 有没有伤到 EPUB"，不重复三遍"EPUB 已经好了"——
        // 左边那本书就摆着，说多了是同一种心虚。
        extra.textContent = payload.azw3.error + "（EPUB 不受影响）";
      } else {
        extra.className = "";
        extra.textContent = payload.azw3.name + "（" +
          bytes_human(payload.azw3.size_bytes) + "，Kindle 用）";
      }
    } else {
      // 没要 AZW3 就整行不出现。"只要了 EPUB" 是句废话。
      row.hidden = true;
    }

    // 封面：这次真打进包里的那一张，不是又一版预览。
    var frame = el("d-frame");
    frame.innerHTML = "";
    if (payload.cover) {
      var img = document.createElement("img");
      img.src = payload.cover;
      img.alt = "这本书的封面";
      frame.appendChild(img);
    } else {
      var d = document.createElement("div");
      d.className = "empty";
      d.textContent = "没有封面\n阅读器会显示书名";
      frame.appendChild(d);
    }

    // 告警（决定30/31/32）：只用 payload.alerts —— 后端已经按"丢了 / 会跳错 /
    // 只是难看"分好级、同类合并成一句带计数的话了。这里不再碰 warnings /
    // problems 原文：那是两条不同来源的流水账，平铺出来就是上一版那面字墙。
    var box = el("d-alerts");
    box.innerHTML = "";
    var alerts = payload.alerts || [];
    if (alerts.length) {
      alerts.forEach(function (a) {
        var row = document.createElement("div");
        row.className = "done-alert";
        row.setAttribute("data-lv", a.level || "layout");
        var p = document.createElement("p");
        p.textContent = a.text;
        row.appendChild(p);
        box.appendChild(row);
      });
      box.hidden = false;
    } else {
      box.hidden = true;
    }

    setView("done");
  }

  // 打包要十几秒（字体子集化那一步最慢），复用处理中那一屏，
  // 但换个说法：这一步不是在清洗，是在排版与打包。
  function startBuild() {
    var a = api();
    if (!a || !currentJob) { return; }
    var meta = {
      title: el("m-title").value.trim(),
      author: el("m-author").value.trim(),
      language: el("m-lang").value.trim() || "zh-CN",
      outdir: el("m-outdir").value.trim(),
      fonts: el("m-fonts").checked,
      azw3: el("m-azw3").checked
    };
    // 封面模式一起送过去。不给 cover_mode 就是"无封面"——
    // 打包层据此完全不碰 cover_path 参数（docs/gui-design.md 的「`gui/cover.py` 接口」一节：不给 build_epub 加新参数）。
    if (coverState.mode === "auto" && coverState.look) {
      meta.cover_mode = "auto";
      // 送整项而不是拆开送 template/theme/background：
      // 队列里两种形态（版式 / 整幅画）字段不同，拆开送会让后端多一层拼装。
      meta.cover_look = coverState.look;
    } else if (coverState.mode === "image") {
      meta.cover_mode = "image";
    } else if (coverState.mode === "source") {
      meta.cover_mode = "source";
    }
    stopPolling();
    // 打包可以从 ③ 也可以从 ④ 发起，取消之后就回发起的那一屏。
    var back = document.body.getAttribute("data-view") || "result";
    busyEnter("build", meta.title || metaTitle(), back);
    a.build_epub(currentJob, meta).then(function (res) {
      if (!res || !res.job_id) {
        showError("没能开始打包", (res && res.error) || "后端没有给出任务号。",
          { step: 4, stepName: "确认书名与封面", back: { view: "meta", label: "回上一步" } });
        return;
      }
      activeJobId = res.job_id;
      pollBuild(res.job_id);
    }).catch(function (err) {
      showError("没能开始打包", "打包这一步没能启动。书名、封面、输出目录都还在。",
        { step: 4, stepName: "确认书名与封面",
          detail: String(err), back: { view: "meta", label: "回上一步" } });
    });
  }

  function pollBuild(jobId) {
    var a = api();
    if (!a) { showError("界面没有连上后端", "pywebview 的桥没有注入成功。",
      { step: 4, stepName: "确认书名与封面" }); return; }
    a.job_poll(jobId).then(function (res) {
      if (jobId !== activeJobId) { return; }
      if (!res) { showError("后端没有回应", "job_poll 返回了空值。",
        { step: 4, stepName: "确认书名与封面", back: { view: "meta", label: "回上一步" } }); return; }
      if (res.error) {
        // 打包失败是最需要「退回去改改」的那种错：书名、封面、输出目录都在 ④ 页，
        // 一颗「换一个文件」会把这三样全扔了。
        showError(res.error_title || "打包失败", res.error, {
          step: 4,
          stepName: "确认书名与封面",
          detail: res.error_detail,
          back: { view: "meta", label: "回上一步" }
        });
        return;
      }
      if (res.done) { stopPolling(); renderDone(res.payload); return; }
      pollTimer = setTimeout(function () { pollBuild(jobId); }, 300);
    }).catch(function (err) {
      if (jobId !== activeJobId) { return; }
      showError("打包时出错", "打包的时候界面和后台失去了一次联系。\n\n退回去再点一次「付梓」就行。",
        { step: 4, stepName: "确认书名与封面",
          detail: String(err), back: { view: "meta", label: "回上一步" } });
    });
  }

  // ---------- 交互 ----------

  // 整个窗口都是落点，但可点的只有裁切线围出的那个框（0.2.2 收窄）：监听挂在
  // 热区 #drop-hot 上，别再挂回 #drop-area —— 两份监听会连弹两次文件框。
  el("drop-hot").addEventListener("click", function () {
    var a = api();
    if (!a) { return; }
    a.pick_file().then(function (res) {
      var paths = (res && res.paths) || [];
      if (paths.length) { startImport(paths[0]); }
      else if (res && res.error) {
        showError("打不开文件选择框", res.error, { step: 1, stepName: "拖进一本书" });
      }
    }).catch(function (err) {
      showError("打不开文件选择框", String(err), { step: 1, stepName: "拖进一本书" });
    });
  });

  // ---------- 关于 ----------
  // 这一屏没有按钮，也没有左上角的返回箭头。出口只有两个：Esc、点页面。
  // 这是用户明知道「看不出来怎么退出」也要换来的干净（决定见 `docs/archive/ui-handover-round3.md` 的 9.1 节）：
  // 一块牌记上多任何一枚控件，它就变成一张设置页了。
  // 整页都算「空白处」—— 点印面上也算。规则只有一条，讲一次就懂。

  function openAbout() { setView("about"); }

  // —— 后者是这一页最后一次改动里最要紧的一处：打包失败的成品还没出来，
  // 可书名、封面、输出目录都在，退回去就能改，不该把这一场会话扔掉。
  el("btn-back").addEventListener("click", function () {

    currentPayload = null;

  el("btn-err-reveal").addEventListener("click", function () {

    a.reveal_in_explorer(errReveal).catch(function () {});

  // 「仍然继续」：函数由 showError 那一次调用给，没有给就是 hidden，
  // 所以这里不用再判一次"该不该出现"，按钮自己不会亮。
  el("btn-err-continue").addEventListener("click", function () {

    if (fn) { fn(); }

  // ② 页「复核」：进 ③ 校样页。这一步以前是断的 —— renderReview 有定义、
  // setView("review") 也只在它内部被调，于是按钮永远没有反应，
  // 而按钮明明显示着可点。46 处监听里就少了这一根线。
  el("btn-review").addEventListener("click", function () {
    var a = api();
    if (!a || !currentJob) { return; }
    // 不起处理中那一屏：review() 是同步返回的（清单算一次挂在会话上，
    // 实测 30ms 量级）。为它闪一屏动画反而像卡了一下。
    Promise.resolve(a.review(currentJob)).then(function (res) {
      if (!res || res.error) {
        showError("打不开复核页", (res && res.error) || "后端没有给出复核数据。",
          { step: 3, stepName: "复核删改", back: { view: "result", label: "回上一步" } });
        return;
      }
      renderReview(res);
    }).catch(function (err) {
      showError("打不开复核页", String(err),
        { step: 3, stepName: "复核删改", back: { view: "result", label: "回上一步" } });

  // ② 页「取消」：这本书不要了。产物已经落盘，先让后端收进回收站再回首页

  el("btn-discard").addEventListener("click", function () {

    currentJob = null;

  el("btn-epub").addEventListener("click", function () {

  // ---------- 封面按钮 ----------
  //
  // 四个动作 + 一个（EPUB 导入才有的）「用原书封面」。
  // 「换一个」不是状态而是动作，所以它不亮；其余四个各自对应一种模式。


  // 「自动生成」第一下：从确定性起点拿一张（同一本书每次打开都是这张）。
  // 第二下起：**换一个** —— 队列里往后走一格，跳过这次已经看过的。
  // 这一下以前是断的：requestCoverPreview 从来没被传过 step=true，
  // 于是 cover.next_look() 永远够不着，「换一个」只是个挂在注释里的概念。
  // 现在按钮自己会改名，用户不用猜「再点一次会怎样」。
  el("btn-cover-auto").addEventListener("click", function () {
    if (!currentJob) { return; }
    if (coverState.mode === "auto" && coverState.lookKey) {
      requestCoverPreview(true);   // 换一个：往后走一格
      return;
    }
    // 从头开始：不传 look、不传 current，后端按书名给确定性起点。
    // （lookKey 只在自动款时非空，走到这里说明屏幕上不是自动封面。）
    coverState.mode = "auto";
    coverState.look = null;
    coverState.lookKey = "";
    coverState.seen = [];
    requestCoverPreview();
  });

  el("btn-cover-pick").addEventListener("click", function () {
    var a = api();
    if (!a || !currentJob) { return; }
    a.pick_cover(currentJob).then(function (res) {
      if (!res || res.cancelled) { return; }
      if (res.error) {
        showError("这张图用不了", res.error,
          { step: 4, stepName: "确认书名与封面", back: { view: "meta", label: "回上一步" } });

  el("btn-cover-none").addEventListener("click", function () {
    coverState.mode = "none";
    coverState.look = null;
    coverState.lookKey = "";
    showCoverEmpty();
    coverCap("");
    coverNote("");
    markCoverButtons();

  // 「用原书封面」只在 EPUB 导入且原包真有封面时显示（renderMeta 里控制 hidden）。

  // ④ 页书名一改，封面上的字跟着改（防抖 400ms）。

  el("btn-done-open").addEventListener("click", function () {
    var a = api();
    if (!a || !currentPayload) { return; }
    // 完成页打开的是 epub 所在目录，不是清洗产物目录（用户这一刻要的是成品）。
    var target = currentPayload.epub || currentPayload.outdir;

  // 「打开这本书」：这一步唯一的「拿到」动作（决定34）。用系统默认阅读器开成品。

  el("btn-done-read").addEventListener("click", function () {
    var a = api();
    if (!a || !currentPayload || !currentPayload.epub) { return; }
    var file = currentPayload.epub;
    a.open_file(file).then(function (res) {
      if (res && res.ok === false) {
        showError("打不开这本书", (res.error || "") +
          "\n\n书已经做好了，点下面那行小字就能找到它。", {

            back: { view: "done", label: "回上一步" },

  // 「再来一本」：清干净会话回首页。它是最轻的那个动作（纯文字），

  el("btn-again").addEventListener("click", function () {

    currentPayload = null;
    setView("drop");

  el("btn-review-back").addEventListener("click", function () {

  // 目录换类：换过去就把这一类记成"看过"（rvDraw 里做），并把列表滚回顶部。
  el("b-dir").addEventListener("click", function (ev) {

  // 滚动发生在 .b-listwrap 上（不是 ul），所以要挂在它身上。
  var rvWrap = document.querySelector("#view-review .b-listwrap");
  if (rvWrap) { rvWrap.addEventListener("scroll", rvOnScroll); }

  // 校定 = 转场，不是新命令：点下去描边收成实底、旧字上移、
  // 「装帧」从下面顶上来，翻完自己往下走，不需要再点第二次。
  el("btn-accept").addEventListener("click", function () {
    var go = el("btn-accept");
    if (go.classList.contains("go")) { return; }
    go.classList.add("go");
    var adjust = rvAdjust();
    var dirty = rvDirty();
    setTimeout(function () {
      if (!dirty) {
        // 没改过就不用重跑：几十秒的等待换不来任何变化。
        renderMeta(currentPayload);
        return;
      }
      var a = api();
      if (!a || !currentJob) { renderMeta(currentPayload); return; }
      busyEnter("rerun", rv.name || metaTitle(), "review");
      Promise.resolve(a.apply_adjust(currentJob, adjust)).then(function (res) {
        if (!res || !res.job_id) {
          showError("改样没能开始", (res && res.error) || "后端没有给出任务号。",
            { step: 3, stepName: "复核删改", back: { view: "review", label: "回上一步" } });
          return;
        }
        // 新 job 的 id 先不写进 currentJob：中途取消的话，复核页还得能按
        // 原来那个 job 继续用。只有真跑完才换。
        var fresh = res.job_id;
        activeJobId = fresh;
        poll(fresh, function (payload) {
          currentJob = fresh;
          currentPayload = payload;
          renderMeta(payload);
        });
      }).catch(function (err) {
        showError("改样失败", "刚才那几处改动没能重新跑一遍。\n\n你已经改的东西还在这张单子上。",
          { step: 3, stepName: "复核删改",
            detail: String(err), back: { view: "review", label: "回上一步" } });
      });
    }, 330);
  });

  el("btn-cancel").addEventListener("click", function () {
    var jid = activeJobId;
    activeJobId = null;
    stopPolling();
    // 取消 = 这次没发生（决定10）：后端会把这次刚产出的东西收进回收站，
    // 界面这边立刻退回上一屏 —— 不转圈、不问"确定吗"。退路不该还要审批。
    var a = api();
    if (jid && a && a.cancel) {
      Promise.resolve(a.cancel(jid)).catch(function () {});
    }
    var back = busyReturn || "drop";
    setView(back);
    if (back === "drop") {
      currentJob = null;
      currentPayload = null;
    }
  });

  // ---------- 拖放：一团墨跟着手 ----------
  //
  // drop 监听由 Python 端用 DOMEventHandler 注册（docs/gui-design.md 的「三个实现陷阱」一节陷阱 1）：JS 这边拿不到
  // 绝对路径，dragover 阶段连路径都没有。所以这里只做两件事：
  // ① 拦住默认行为 —— 没有 preventDefault，WebView2 会直接把窗口导航到被
  //    拖进来的那个文件上，界面就没了；
  // ② 按 MIME 分个类，让画面知道这团墨该是暖的还是墨的。
  //
  // 分类只看 dataTransfer 给的 MIME，结论分三档 —— 宁可少表态，不可乱表态：
  //   "book"  ：认出是书（纯文本 / EPUB / MOBI）；
  //   "other" ：认出明显不是书（图片、音视频、PDF、压缩包、JSON/XML、
  //             可执行文件、办公文档……）；
  //   ""      ：两边都认不出（octet-stream、空 MIME、冷门类型），不表态。
  // 为什么非要中间这一档：Windows 常常报不出 .azw3 自己的类型，只给一个通用
  // 类型 —— 一律按"不是书"会把真书挡在门外；一律按"可能是书"又会给 exe/json
  // 亮「书稿已得」（2026-11-09 用户反馈的正是这个）。AZW3 因此落进"不表态"，
  // 松手后由 Python 按扩展名给出准确提示 —— 这里不猜第二遍。
  // 取舍见 docs/notes/drop-classification-three-ways.md。
  // 同一个格式在 Windows 上可能报好几种 MIME：EPUB 常见 application/epub+zip，
  // 但注册表里也可能是 application/epub；MOBI 可能是 application/mobi 或
  // application/x-mobipocket-ebook；AZW3 反而常常一个类型都没有，落进中间那档。
  var BOOK_MIME = /^(text\/plain|text\/text|application\/epub(\+zip)?|application\/mobi|application\/x-mobi8-ebook|application\/x-mobipocket-ebook|application\/vnd\.amazon\.ebook)$/;
  // 图片 / 音视频 / 字体，以及除纯文本以外的 text/*（网页、CSV、源码……）。
  var NOT_BOOK = /^(image|video|audio|font|text)\//;
  // 办公文档：Word（含宏文档、模板）/ RTF / WPS（金山 kswps 与 MS Works
  // 两套）/ Office 整套 / ODF 整套。只认 MIME，一个扩展名都不写（dragover
  // 阶段本来就拿不到扩展名）。
  // 注意 application/epub+zip 不在这里 —— 它恰恰是要收的那种。
  var NOT_BOOK_DOC = /^application\/(msword|rtf|kswps|vnd\.ms-word|vnd\.ms-works|vnd\.ms-excel|vnd\.ms-powerpoint|vnd\.openxmlformats-officedocument\.|vnd\.oasis\.opendocument\.)/;
  // 其余一眼不是书的常见类型：PDF、JSON/XML、脚本、各种压缩包、可执行程序。
  // 可执行只认 application/x-msdownload（.exe）与几个安装包类型，不去枚举
  // Windows 全部可执行类型 —— 认不出的自然落进中间那档，由 Python 给结论。
  var NOT_BOOK_OTHER = /^application\/(pdf|json|xml|javascript|ecmascript|x-msdownload|x-msi|x-msdos-program|x-ms-installer|zip|x-zip-compressed|x-rar-compressed|x-7z-compressed|x-gzip|x-tar|x-bzip2|gzip)/;

  // 一次拖拽可能带好几个文件（还可能混着类型）。只要有一个认得出的书就当书：
  // Python 那边会逐个报"这个不是书"，这里只回答"该不该亮「书稿已得」"。
  function classifyDrag(types) {
    var book = false;
    var other = false;
    for (var i = 0; i < types.length; i++) {
      var t = types[i];
      if (BOOK_MIME.test(t)) { book = true; }
      else if (NOT_BOOK.test(t) || NOT_BOOK_DOC.test(t) || NOT_BOOK_OTHER.test(t)) { other = true; }
    }
    if (book) { return "book"; }
    if (other) { return "other"; }
    return "";
  }

  // 这次拖进来那些文件的类型。items 只在 dragenter / dragover 里读得到；
  // 读不到就退回 dt.types —— 但那张表里混着两种"不是文件类型"的串：
  // 一是 "Files" 这种非 MIME 的串，二是拖一段网页里选中的文字时会带的
  // text/plain、text/html、text/uri-list。所以只收含 "/" 的串、再排掉这三种
  // "选中文字"的 MIME；过滤完是空的就当"信息不足"（上层不改状态），
  // 拿它们去分类只能瞎猜（会闪一下「书稿已得」）。
  var TEXT_DRAG = { "text/plain": 1, "text/html": 1, "text/uri-list": 1 };

  function kindsOf(dt) {
    var out = [];
    if (!dt) { return out; }
    if (dt.items && dt.items.length) {
      for (var i = 0; i < dt.items.length; i++) {
        var it = dt.items[i];
        if (it && it.kind === "file" && it.type && it.type.indexOf("/") >= 0) {
          out.push(it.type);
        }
      }
    }
    if (!out.length && dt.types) {
      for (var j = 0; j < dt.types.length; j++) {
        var t = dt.types[j];
        if (typeof t === "string" && t.indexOf("/") >= 0 && !TEXT_DRAG[t]) { out.push(t); }
      }
    }
    return out;
  }

  // 墨心跟手：坐标量成相对 #drop-area 的像素值，写进两个 CSS 变量。
  //
  // 这一次拖拽里墨团是否已经就过位。收墨时复位 —— 下次拖进来又要重新就位一次。
  //
  // 第一次显形那一帧要特殊处理：平时 --x/--y 是兜底的 50%，那是相对墨团自身
  // 560px 算的，落在区域左上 280,280 处。要是带着 420ms 的 transform 过渡显形，
  // 墨团会从那儿一路飘到光标，看着像从别处飞过来。所以首次写坐标时先挂上
  // bloom-snap 关掉过渡，写完逼一次样式计算让坐标当场就位，再把类摘掉。
  var bloomSeated = false;

  function placeBloom(ev) {
    var area = el("drop-area");
    var box = area.getBoundingClientRect();
    var first = !bloomSeated;
    if (first) { area.classList.add("bloom-snap"); }
    area.style.setProperty("--x", (ev.clientX - box.left) + "px");
    area.style.setProperty("--y", (ev.clientY - box.top) + "px");
    if (first) {
      window.getComputedStyle(area.querySelector(".bloom")).transform;
      area.classList.remove("bloom-snap");
      bloomSeated = true;
    }
  }

  // state: "" 平时 / "book" 能处理的书 / "other" 明显不是书
  function setDropState(state) {
    var area = el("drop-area");
    if (state) { area.setAttribute("data-drop", state); }
    else { area.removeAttribute("data-drop"); bloomSeated = false; }
    document.body.setAttribute("data-drop-active", state ? "1" : "0");
  }

  ["dragenter", "dragover"].forEach(function (name) {
    document.addEventListener(name, function (ev) {
      ev.preventDefault();
      ev.stopPropagation();
      if (ev.dataTransfer) { ev.dataTransfer.dropEffect = "copy"; }
      // 只在首屏吃这一手：拖着文件从别的屏路过时不该冒出一团墨
      if (document.body.getAttribute("data-view") !== "drop") { return; }
      var kinds = kindsOf(ev.dataTransfer);
      // 信息不足就不猜：types 里只剩 "Files" 这种非 MIME 串、或者只是拖了
      // 一段网页选中文字时 kinds 是空的，这时改状态只会在松手瞬间闪一下
      // 「书稿已得」。等真有文件 MIME 再表态。
      if (!kinds.length) { return; }
      var cls = classifyDrag(kinds);
      // 认不出的类型不表态（不改状态，只让墨团继续跟手）：等松手后由 Python
      // 按扩展名给结论，界面上就不会在拖 exe/json 时先亮一句「书稿已得」。
      if (cls) { setDropState(cls); }
      placeBloom(ev);
    }, false);
  });
  ["dragleave", "dragend"].forEach(function (name) {
    document.addEventListener(name, function (ev) {
      ev.preventDefault();
      // 只有真的离开窗口才收墨：在子元素之间移动也会触发 dragleave
      if (name === "dragleave" && ev.relatedTarget) { return; }
      setDropState("");
    }, false);
  });

  // 松手必须收墨。真实浏览器里 dragleave 不一定补得上：规范说只有"取消拖拽"
  // 才立刻 fire dragleave，正常松手时它不保证来；dragend 又只派给被拖的那个
  // 元素 —— 从资源管理器拖过来时那个元素在别的进程里，本页收不到。于是剩下的
  // 只有 drop 这一条真会发生的事件。
  //
  // **只清态，不 preventDefault、不 stopPropagation**：拦默认行为与取绝对路径
  // 都是 Python 端那个 DOMEventHandler 的活（见 gui/app.py 的 _register_drop），
  // 这里多拦一手会把它挡掉。拖进来一段网页文字时 Python 侧取不到路径、静默
  // return，这时就全靠这一行把墨团收回去。
  document.addEventListener("drop", function () {
    setDropState("");
  }, false);

  // Python 端拿到绝对路径后调这个（utils.py 注入的 pywebviewFullPath 只在
  // 那一侧可见，JS 这里拿不到，只能由 Python 转回来）。
  window.__onDropPath = function (path) {
    setDropState("");
    startImport(path);
  };

  // ---------- 主题：跟随系统 / 固定深 / 固定浅 ----------
  //
  // 三态由 <html data-theme="system|dark|light"> 记，另外用 data-dark="1|0"
  // 把"当前到底是不是深色"算出来交给 CSS —— CSS 只认 data-dark，
  // 这样"固定浅色"在系统是深色时也真的浅（只认 media query 做不到）。
  //
  // 为什么要存：用户明确要"跟随系统"。跟随系统意味着用户改了系统主题要跟着变，
  // 而 WebView2 的 matchMedia 不会主动通知我们 —— 靠打开窗口时读一次 + 切换时读一次，
  // 够用（这个应用不会长时间挂着等主题变化）。
  // 主题不落盘，只活在这一次运行里。
  // 原来走 localStorage，但这个窗口是用 html= 注入的，location.origin === "null"，
  // 任何 localStorage 读写都抛 SecurityError —— 所以 readTheme() 的 catch 永远
  // 返回 "system"，而 cycleTheme() 每次又从 "system" 算下一个，于是永远只在
  // 「跟随系统 → 深色」之间跳，浅色那一档代码上不可达（决定1 的 bug）。
  // 跨启动记忆要等后端开口子（乙案），这轮先用内存。
  var themeMode = "system";
  var THEME_ORDER = ["system", "dark", "light"];
  var THEME_LABEL = { system: "跟随系统", dark: "深色", light: "浅色" };

  function prefersDark() {
    try {
      return !!(window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
    } catch (e) { return false; }
  }

  function readTheme() { return themeMode; }

  function applyTheme(mode) {
    var dark = mode === "dark" || (mode === "system" && prefersDark());
    document.documentElement.setAttribute("data-theme", mode);
    document.documentElement.setAttribute("data-dark", dark ? "1" : "0");
    var btn = el("btn-theme");
    if (btn) {
      btn.title = "主题：" + THEME_LABEL[mode] + "（点一下换一个）";
      btn.setAttribute("aria-label", btn.title);
      // 深色时把太阳换成月亮：图标本身就是当前状态的说明，
      // 不用再另加一行文字。
      btn.innerHTML = dark
        ? '<svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"><path d="M13.4 9.6A5.6 5.6 0 0 1 6.4 2.6a5.7 5.7 0 1 0 7 7z"/></svg>'
        : '<svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"><path d="M8 1.6v1.5M8 12.9v1.5M1.6 8h1.5M12.9 8h1.5M3.5 3.5l1 1M11.5 11.5l1 1M12.5 3.5l-1 1M4.5 11.5l-1 1"/><circle cx="8" cy="8" r="2.9"/></svg>';
    }
  }

  function cycleTheme() {
    var i = THEME_ORDER.indexOf(readTheme());
    themeMode = THEME_ORDER[(i + 1) % THEME_ORDER.length];
    applyTheme(themeMode);
  }

  // 系统主题变了（且我们是"跟随系统"）就重算一次。
  try {
    if (window.matchMedia) {
      var mq = window.matchMedia("(prefers-color-scheme: dark)");
      var onScheme = function () { if (readTheme() === "system") { applyTheme("system"); } };
      if (mq.addEventListener) { mq.addEventListener("change", onScheme); }
      else if (mq.addListener) { mq.addListener(onScheme); }
    }
  } catch (e) { /* 老 WebView 没有 matchMedia，跟随系统就退化成浅色 */ }

  applyTheme(readTheme());
  if (el("btn-theme")) { el("btn-theme").addEventListener("click", cycleTheme); }

  window.addEventListener("pywebviewready", function () {
    bridgeReady = true;
    var a = api();
    if (a && a.app_info) {
      a.app_info().then(function (info) {
        // 版本号在界面上只出现在一个地方：关于页。决定4 撤掉的是顶栏
        // 每屏都要挂的那个版本号 —— 「这是什么程序」一辈子问一次，
        // 问的时候翻到牌记上看，别的时候它不该占版面。
        if (info && info.version) {
          var v = el("ab-ver");
          if (v) { v.textContent = info.version; }
        }
        // 没装 Calibre 就把 AZW3 那个选项置灰并说明原因 —— 让人勾了再失败，
        // 比一开始就说清楚差得多。
        if (info && info.azw3 === false) {
          el("m-azw3").disabled = true;
          el("m-azw3-label").textContent =
            "同时导出 AZW3（这台机器没装 Calibre，EPUB 不受影响）";
        }
      }).catch(function () { /* 版本号拿不到就不显示，不值得为此报错 */ });
    }
    if (pendingPath) {
      var p = pendingPath;
      pendingPath = null;
      startImport(p);
    }
  }, false);
})();
</script>
</body>
</html>
